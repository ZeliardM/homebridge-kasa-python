name: Finalize Release

# This workflow runs when a release is published to:
# 1. Update CHANGELOG.md to convert "Unreleased" to the actual version
# 2. Add a changelog entry for the version update commit itself
# 3. No need to sync content to release since release-drafter.yml now handles that

on:
  release:
    types: [published]

jobs:
  finalize-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update changelog and add version commit entry
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_DATE=$(date +%Y-%m-%d)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          
          echo "Finalizing changelog for release: $RELEASE_TAG"
          
          python3 << 'EOF'
          import re
          import os
          from datetime import datetime
          
          release_tag = os.environ.get('RELEASE_TAG', '')
          release_date = os.environ.get('RELEASE_DATE', '')
          release_url = os.environ.get('RELEASE_URL', '')
          
          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          # Replace [Unreleased] with actual version and add link
          version_header = f"## [{release_tag}]({release_url}) ({release_date})"
          updated_content = content.replace("## [Unreleased]", version_header)
          
          lines = updated_content.split('\n')
          new_lines = []
          header_found = False
          in_current_release = False
          added_commit_entry = False
          other_changes_found = False
          
          for i, line in enumerate(lines):
              if line.startswith("# ") and not header_found:
                  header_found = True
                  new_lines.append(line)
                  # Add new empty Unreleased section after main header
                  new_lines.extend([
                      "",
                      "## [Unreleased]",
                      ""
                  ])
              elif line == version_header:
                  # Found the version we just created
                  new_lines.append(line)
                  in_current_release = True
                  other_changes_found = False
              elif in_current_release and line == "### Other Changes":
                  # Found existing Other Changes section in current release
                  new_lines.append(line)
                  other_changes_found = True
              elif in_current_release and line.startswith("## ") and line != version_header:
                  # Found the next release section, end of current release
                  if not added_commit_entry:
                      if other_changes_found:
                          # Add to existing Other Changes section - insert before this line
                          new_lines.extend([
                              f"- Update CHANGELOG.md version to {release_tag} @github-actions [release]",
                              ""
                          ])
                      else:
                          # Create new Other Changes section
                          new_lines.extend([
                              "",
                              "### Other Changes",
                              "",
                              f"- Update CHANGELOG.md version to {release_tag} @github-actions [release]",
                              ""
                          ])
                      added_commit_entry = True
                  new_lines.append(line)
                  in_current_release = False
              elif in_current_release and other_changes_found and line.startswith("- ") and not added_commit_entry:
                  # Add our entry before the first existing entry in Other Changes
                  new_lines.extend([
                      f"- Update CHANGELOG.md version to {release_tag} @github-actions [release]",
                      line
                  ])
                  added_commit_entry = True
              else:
                  new_lines.append(line)
          
          # If we're still in the current release at the end of file
          if in_current_release and not added_commit_entry:
              if other_changes_found:
                  new_lines.append(f"- Update CHANGELOG.md version to {release_tag} @github-actions [release]")
              else:
                  new_lines.extend([
                      "",
                      "### Other Changes",
                      "",
                      f"- Update CHANGELOG.md version to {release_tag} @github-actions [release]"
                  ])
          
          final_content = '\n'.join(new_lines)
          
          # Ensure proper ending
          if not final_content.endswith('\n'):
              final_content += '\n'
          
          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)
          
          print(f"Changelog updated: Unreleased -> {release_tag}")
          print(f"Added version update commit entry to bottom of {release_tag} section")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: $(date +%Y-%m-%d)
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}

      - name: Commit changelog updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed"
          else
            git add CHANGELOG.md
            git commit -m "Update CHANGELOG.md version to ${{ github.event.release.tag_name }}"
            git push
            echo "Changelog finalized for release ${{ github.event.release.tag_name }}"
          fi