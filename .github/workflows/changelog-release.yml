name: Finalize Release

# This workflow runs when a release is published to add the version 
# update commit entry to the bottom of the released version section.

on:
  release:
    types: [published]

jobs:
  finalize-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add version update commit to changelog
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          echo "Adding version update commit entry for: $RELEASE_TAG"
          
          python3 << 'EOF'
          import re
          import os
          
          release_tag = os.environ.get('RELEASE_TAG', '')
          
          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          lines = content.split('\n')
          new_lines = []
          in_target_release = False
          added_commit_entry = False
          other_changes_found = False
          
          for i, line in enumerate(lines):
              if line.startswith(f"## [{release_tag}]"):
                  # Found the target release section
                  new_lines.append(line)
                  in_target_release = True
                  other_changes_found = False
              elif in_target_release and line == "### Other Changes":
                  # Found existing Other Changes section in target release
                  new_lines.append(line)
                  other_changes_found = True
              elif in_target_release and line.startswith("## ") and not line.startswith(f"## [{release_tag}]"):
                  # Found next release section, end of target release
                  if not added_commit_entry:
                      if other_changes_found:
                          # Insert before this next section
                          new_lines.extend([
                              f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                              ""
                          ])
                      else:
                          # Create new Other Changes section
                          new_lines.extend([
                              "### Other Changes",
                              "",
                              f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                              ""
                          ])
                      added_commit_entry = True
                  new_lines.append(line)
                  in_target_release = False
              elif in_target_release and other_changes_found and line.startswith("- ") and not added_commit_entry:
                  # Add our entry at the top of existing Other Changes entries
                  new_lines.extend([
                      f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                      line
                  ])
                  added_commit_entry = True
              elif in_target_release and line.startswith("**Full Changelog**") and not added_commit_entry:
                  # Add entry before the full changelog link
                  if other_changes_found:
                      new_lines.extend([
                          f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                          "",
                          line
                      ])
                  else:
                      new_lines.extend([
                          "### Other Changes",
                          "",
                          f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                          "",
                          line
                      ])
                  added_commit_entry = True
              else:
                  new_lines.append(line)
          
          # If we're still in the target release at the end of file
          if in_target_release and not added_commit_entry:
              if other_changes_found:
                  new_lines.append(f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]")
              else:
                  new_lines.extend([
                      "",
                      "### Other Changes",
                      "",
                      f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]"
                  ])
          
          final_content = '\n'.join(new_lines)
          
          # Ensure proper ending
          if not final_content.endswith('\n'):
              final_content += '\n'
          
          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)
          
          print(f"Added version update commit entry to {release_tag} section")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Commit changelog updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed"
          else
            git add CHANGELOG.md
            git commit -m "Add changelog entry for release ${{ github.event.release.tag_name }} update"
            git push
            echo "Changelog finalized for release ${{ github.event.release.tag_name }}"
          fi