name: Finalize Release

# This workflow runs when a release is published to:
# 1. Ensure CHANGELOG.md and release body are synchronized
# 2. Add the version update commit entry to the released version section
# 3. Ensure proper association with PRs, issues, and commits

on:
  release:
    types: [published]

jobs:
  finalize-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync changelog and release content
        id: sync
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          
          echo "Ensuring CHANGELOG.md and release body are synchronized for: $RELEASE_TAG"
          
          python3 << 'EOF'
          import re
          import os
          import json
          
          release_tag = os.environ.get('RELEASE_TAG', '')
          release_body = os.environ.get('RELEASE_BODY', '')
          
          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              changelog_content = f.read()
          
          # Extract changelog content for this release
          lines = changelog_content.split('\n')
          changelog_release_content = []
          in_target_release = False
          
          for line in lines:
              if line.startswith(f"## [{release_tag}]"):
                  in_target_release = True
                  continue
              elif in_target_release and line.startswith("## ") and not line.startswith(f"## [{release_tag}]"):
                  break
              elif in_target_release and line.strip() and not line.startswith("**Full Changelog**"):
                  changelog_release_content.append(line)
          
          changelog_content_str = '\n'.join(changelog_release_content).strip()
          
          # Convert changelog format to release format for comparison
          release_format_content = re.sub(r'^### ', '## ', changelog_content_str, flags=re.MULTILINE)
          
          # Clean release body for comparison (remove Full Changelog links)
          clean_release_body = re.sub(r'\*\*Full Changelog\*\*:.*?\n?', '', release_body).strip()
          
          print("Changelog content:")
          print(repr(changelog_content_str))
          print("\nRelease body content:")
          print(repr(clean_release_body))
          print("\nConverted changelog format:")
          print(repr(release_format_content))
          
          # Check if they match (allowing for minor formatting differences)
          content_match = release_format_content.replace(' ', '').replace('\n', '') == clean_release_body.replace(' ', '').replace('\n', '')
          
          print(f"\nContent match: {content_match}")
          
          if not content_match:
              print("CHANGELOG and release body do not match - this needs manual review")
              # For now, we'll continue with the process but log the discrepancy
          
          # Write sync status to output
          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a') as f:
                  f.write(f"content_synced={str(content_match).lower()}\n")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}

      - name: Add version update commit to changelog
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          echo "Adding version update commit entry for: $RELEASE_TAG"
          
          python3 << 'EOF'
          import re
          import os
          
          release_tag = os.environ.get('RELEASE_TAG', '')
          
          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          lines = content.split('\n')
          new_lines = []
          in_target_release = False
          added_commit_entry = False
          other_changes_found = False
          
          for i, line in enumerate(lines):
              if line.startswith(f"## [{release_tag}]"):
                  # Found the target release section
                  new_lines.append(line)
                  in_target_release = True
                  other_changes_found = False
              elif in_target_release and line == "### Other Changes":
                  # Found existing Other Changes section in target release
                  new_lines.append(line)
                  other_changes_found = True
              elif in_target_release and line.startswith("## ") and not line.startswith(f"## [{release_tag}]"):
                  # Found next release section, end of target release
                  if not added_commit_entry:
                      if other_changes_found:
                          # Insert before this next section
                          new_lines.extend([
                              f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                              ""
                          ])
                      else:
                          # Create new Other Changes section
                          new_lines.extend([
                              "### Other Changes",
                              "",
                              f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                              ""
                          ])
                      added_commit_entry = True
                  new_lines.append(line)
                  in_target_release = False
              elif in_target_release and other_changes_found and line.startswith("- ") and not added_commit_entry:
                  # Add our entry at the top of existing Other Changes entries
                  new_lines.extend([
                      f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                      line
                  ])
                  added_commit_entry = True
              elif in_target_release and line.startswith("**Full Changelog**") and not added_commit_entry:
                  # Add entry before the full changelog link
                  if other_changes_found:
                      new_lines.extend([
                          f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                          "",
                          line
                      ])
                  else:
                      new_lines.extend([
                          "### Other Changes",
                          "",
                          f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]",
                          "",
                          line
                      ])
                  added_commit_entry = True
              else:
                  new_lines.append(line)
          
          # If we're still in the target release at the end of file
          if in_target_release and not added_commit_entry:
              if other_changes_found:
                  new_lines.append(f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]")
              else:
                  new_lines.extend([
                      "",
                      "### Other Changes",
                      "",
                      f"- Update CHANGELOG.md for release {release_tag} @github-actions [release]"
                  ])
          
          final_content = '\n'.join(new_lines)
          
          # Ensure proper ending
          if not final_content.endswith('\n'):
              final_content += '\n'
          
          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)
          
          print(f"Added version update commit entry to {release_tag} section")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Update release body with version commit
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          echo "Adding version update commit to release body for: $RELEASE_TAG"
          
          # Get current release body
          CURRENT_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" | \
            jq -r '.body')
          
          # Add version commit entry to release body
          VERSION_COMMIT="- Update CHANGELOG.md for release $RELEASE_TAG @github-actions [release]"
          
          # Check if "Other Changes" section exists in release body
          if echo "$CURRENT_BODY" | grep -q "## Other Changes"; then
            # Add to existing Other Changes section
            UPDATED_BODY=$(echo "$CURRENT_BODY" | sed "/## Other Changes/a\\n$VERSION_COMMIT")
          else
            # Add new Other Changes section before Full Changelog
            UPDATED_BODY=$(echo "$CURRENT_BODY" | sed "/\*\*Full Changelog\*\*/i\\n## Other Changes\\n\\$VERSION_COMMIT\\n")
          fi
          
          # Update the release
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            -d "$(jq -n --arg body "$UPDATED_BODY" '{body: $body}')"
          
          echo "Release body updated with version commit"

      - name: Commit final changelog updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed"
          else
            git add CHANGELOG.md
            git commit -m "Add changelog entry for release ${{ github.event.release.tag_name }} update"
            git push
            echo "Final changelog committed for release ${{ github.event.release.tag_name }}"
          fi

      - name: Verify release associations
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "Verifying release associations for: $RELEASE_TAG"
          
          # Get the tag commit
          TAG_COMMIT=$(git rev-list -n 1 $RELEASE_TAG)
          echo "Tag commit: $TAG_COMMIT"
          
          # Get associated PRs and issues (this is mainly for logging/verification)
          echo "Release successfully finalized and associated with commit: $TAG_COMMIT"
          echo "CHANGELOG.md, release body, and git tag are now synchronized"