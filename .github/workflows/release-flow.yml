---
name: Release Flow

on:
  pull_request:
    types: [closed]
    branches: [beta, latest]
  push:
    branches: [beta]

permissions:
  contents: write
  pull-requests: read

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  detect-fork:
    name: Detect Fork
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork-context.outputs.is_fork }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Fork Context
        id: detect-fork-context
        uses: ./.github/actions/detect-fork

  prepare:
    name: Validate Environment
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false'
    steps:
      - name: Validate Environment
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"

  pr-merge:
    name: Pull Request Merge
    runs-on: ubuntu-latest
    needs: prepare
    concurrency:
      group: release-flow-write-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    if: >
      needs.prepare.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.base.ref == 'beta' ||
        (
          github.event.pull_request.base.ref == 'latest' &&
          contains(github.event.pull_request.labels.*.name, 'stable-conversion')
        )
      )
    env:
      PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
      PULL_REQUEST_BRANCH: ${{ github.event.pull_request.base.ref }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node 24
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Serialize Labels
        id: labels
        uses: ./.github/actions/serialize-labels
        with:
          labels_json: ${{ toJson(github.event.pull_request.labels.*.name) }}

      - name: Update CHANGELOG.md and Create/Update Draft Release
        id: update-release
        if: steps.labels.outcome == 'success'
        shell: bash
        env:
          MODE: pr-merge
          PULL_REQUEST_LABELS: ${{ steps.labels.outputs.path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_manager.py

  manual-commit-push:
    name: Manual Commit Push
    runs-on: ubuntu-latest
    needs: prepare
    concurrency:
      group: release-flow-write-${{ github.ref_name }}
      cancel-in-progress: false
    if: >
      needs.prepare.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/beta' &&
      github.actor != 'github-actions[bot]'
    env:
      HEAD_AFTER: ${{ github.event.after }}
      HEAD_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node 24
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update CHANGELOG.md and Create/Update Draft Release
        id: update-release
        shell: bash
        env:
          MODE: commit-push
        run: |
          set -euo pipefail
          python3 .github/scripts/release_manager.py

  fork-notice:
    name: Fork Notice
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    steps:
      - name: Fork Notice
        id: fork-notice
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice:: This workflow is running in a forked repository. All privileged steps have been skipped."
