name: Update Changelog

# This workflow automatically updates CHANGELOG.md when PRs are merged to the main branch.
# It categorizes changes based on PR labels and maintains the Keep a Changelog format
# that the changelog-release workflow expects.
#
# The workflow is simplified to always add entries to an "Unreleased" section, which
# gets converted to actual version numbers when releases are published.

on:
  pull_request:
    types: [closed]
    branches: [latest]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Check for existing draft release
        id: check-draft
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Check if there's already a draft release
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          
          DRAFT_ID=$(echo "$RELEASES" | jq -r '.[] | select(.draft == true) | .id' | head -1)
          DRAFT_TAG=$(echo "$RELEASES" | jq -r '.[] | select(.draft == true) | .tag_name' | head -1)
          
          if [ "$DRAFT_ID" != "null" ] && [ "$DRAFT_ID" != "" ]; then
            echo "Found existing draft release: $DRAFT_TAG (ID: $DRAFT_ID)"
            echo "has_draft=true" >> $GITHUB_OUTPUT
            echo "draft_id=$DRAFT_ID" >> $GITHUB_OUTPUT
            echo "draft_tag=$DRAFT_TAG" >> $GITHUB_OUTPUT
          else
            echo "No existing draft release found"
            echo "has_draft=false" >> $GITHUB_OUTPUT
          fi

      - name: Categorize PR
        id: categorize
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR Labels: $labels"
          
          # Determine category based on labels (matching release-drafter.yml)
          category="Other Changes"
          
          if echo "$labels" | grep -q "breaking change"; then
            category="Breaking Changes"
          elif echo "$labels" | grep -qE "(feature|enhancement)"; then
            category="Featured Changes"
          elif echo "$labels" | grep -qE "(fix|bugfix|bug)"; then
            category="Bug Fixes"
          elif echo "$labels" | grep -q "documentation"; then
            category="Other Changes"
          fi
          
          echo "category=$category" >> $GITHUB_OUTPUT
          echo "Categorized as: $category"

      - name: Update CHANGELOG.md
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          CATEGORY="${{ steps.categorize.outputs.category }}"
          HAS_DRAFT="${{ steps.check-draft.outputs.has_draft }}"
          DRAFT_TAG="${{ steps.check-draft.outputs.draft_tag }}"
          
          # Format the changelog entry
          CHANGE_ENTRY="- $PR_TITLE @$PR_AUTHOR [#$PR_NUMBER]"
          
          echo "Adding entry: $CHANGE_ENTRY"
          echo "Category: $CATEGORY"
          echo "Has draft release: $HAS_DRAFT"
          if [ "$HAS_DRAFT" == "true" ]; then
            echo "Draft tag: $DRAFT_TAG"
          fi
          
          # Use Python script to update changelog with proper logic
          python3 << 'EOF'
          import re
          import sys
          import os
          
          # Read the current changelog
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              content = "# Changelog\n\n"
          
          change_entry = os.environ.get('CHANGE_ENTRY', '')
          category = os.environ.get('CATEGORY', '')
          has_draft = os.environ.get('HAS_DRAFT', 'false')
          draft_tag = os.environ.get('DRAFT_TAG', '')
          
          if not change_entry or not category:
              print("Missing environment variables")
              sys.exit(1)
          
          lines = content.split('\n')
          
          def add_entry_to_changelog(content, section_header, category, change_entry):
              """Add entry to a specific section and category in the changelog."""
              lines = content.split('\n')
              
              # Find the section
              section_start = -1
              section_end = len(lines)
              
              for i, line in enumerate(lines):
                  if line.startswith(section_header):
                      section_start = i
                  elif section_start >= 0 and line.startswith("## ") and line != section_header:
                      section_end = i
                      break
              
              if section_start == -1:
                  # Section doesn't exist
                  return content
              
              # Extract section content
              before_section = lines[:section_start + 1]
              section_content = lines[section_start + 1:section_end]
              after_section = lines[section_end:]
              
              # Find or create the category within the section
              category_start = -1
              category_end = len(section_content)
              
              for i, line in enumerate(section_content):
                  if line == f"### {category}":
                      category_start = i
                  elif category_start >= 0 and line.startswith("### "):
                      category_end = i
                      break
                  elif category_start >= 0 and line.startswith("**Full Changelog**"):
                      category_end = i
                      break
              
              if category_start >= 0:
                  # Category exists, add to it
                  before_category = section_content[:category_start + 1]
                  
                  # Handle empty line after category header
                  insert_pos = category_start + 1
                  if insert_pos < len(section_content) and section_content[insert_pos] == "":
                      before_category.append("")
                      insert_pos += 1
                  else:
                      before_category.append("")
                  
                  # Add our entry
                  before_category.append(change_entry)
                  
                  # Add the rest
                  after_category = section_content[insert_pos:category_end]
                  remaining_section = section_content[category_end:]
                  
                  new_section_content = before_category + after_category + remaining_section
              else:
                  # Category doesn't exist, create it
                  # Find the right place to insert it (before other categories or at the end)
                  insert_pos = 0
                  for i, line in enumerate(section_content):
                      if line.startswith("### ") or line.startswith("**Full Changelog**"):
                          insert_pos = i
                          break
                  else:
                      insert_pos = len(section_content)
                  
                  # Insert category and entry
                  before_insert = section_content[:insert_pos]
                  after_insert = section_content[insert_pos:]
                  
                  if before_insert and before_insert[-1] != "":
                      before_insert.append("")
                  
                  new_category = [f"### {category}", "", change_entry]
                  
                  if after_insert and after_insert[0] != "":
                      new_category.append("")
                  
                  new_section_content = before_insert + new_category + after_insert
              
              # Reconstruct the content
              result_lines = before_section + new_section_content + after_section
              return '\n'.join(result_lines)
          
          if has_draft == 'true' and draft_tag:
              # There's a draft release - add content to that version section
              print(f"Adding to existing draft version: {draft_tag}")
              target_header = f"## [{draft_tag}]"
              content = add_entry_to_changelog(content, target_header, category, change_entry)
                      
          else:
              # No draft release - use Unreleased section
              print("Adding to Unreleased section")
              
              # Check if we need to create Unreleased section
              if "## [Unreleased]" not in content:
                  # Add new Unreleased section after main header
                  lines = content.split('\n')
                  new_lines = []
                  header_found = False
                  for line in lines:
                      new_lines.append(line)
                      if line.startswith("# ") and not header_found:
                          header_found = True
                          new_lines.extend([
                              "",
                              "## [Unreleased]",
                              "",
                              f"### {category}",
                              "",
                              change_entry,
                              ""
                          ])
                          break
                  content = '\n'.join(new_lines)
              else:
                  # Process existing content for Unreleased section
                  content = add_entry_to_changelog(content, "## [Unreleased]", category, change_entry)
          
          # Clean up excessive blank lines while maintaining structure
          lines = content.split('\n')
          final_lines = []
          prev_line = ""
          for line in lines:
              # Avoid more than one consecutive empty line
              if line == "" and prev_line == "":
                  continue
              final_lines.append(line)
              prev_line = line
          
          # Ensure file ends with single newline
          content = '\n'.join(final_lines)
          if not content.endswith('\n'):
              content += '\n'
          
          # Write the updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          
          print("Changelog updated successfully")
          print(f"Added: {change_entry}")
          print(f"To category: {category}")
          if has_draft == 'true':
              print(f"In version section: {draft_tag}")
          else:
              print("In Unreleased section")
          EOF
        env:
          CHANGE_ENTRY: "- ${{ github.event.pull_request.title }} @${{ github.event.pull_request.user.login }} [#${{ github.event.pull_request.number }}]"
          CATEGORY: ${{ steps.categorize.outputs.category }}
          HAS_DRAFT: ${{ steps.check-draft.outputs.has_draft }}
          DRAFT_TAG: ${{ steps.check-draft.outputs.draft_tag }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "Update CHANGELOG.md for PR #${{ github.event.pull_request.number }}"
            git push
            echo "Changelog updated successfully"
          fi