name: Update Changelog

# This workflow automatically updates CHANGELOG.md when PRs are merged to the main branch.
# It categorizes changes based on PR labels and maintains the Keep a Changelog format
# that the changelog-release workflow expects.
#
# The workflow is simplified to always add entries to an "Unreleased" section, which
# gets converted to actual version numbers when releases are published.

on:
  pull_request:
    types: [closed]
    branches: [latest]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Check for existing draft release
        id: check-draft
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Check if there's already a draft release
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          
          DRAFT_ID=$(echo "$RELEASES" | jq -r '.[] | select(.draft == true) | .id' | head -1)
          DRAFT_TAG=$(echo "$RELEASES" | jq -r '.[] | select(.draft == true) | .tag_name' | head -1)
          
          if [ "$DRAFT_ID" != "null" ] && [ "$DRAFT_ID" != "" ]; then
            echo "Found existing draft release: $DRAFT_TAG (ID: $DRAFT_ID)"
            echo "has_draft=true" >> $GITHUB_OUTPUT
            echo "draft_id=$DRAFT_ID" >> $GITHUB_OUTPUT
            echo "draft_tag=$DRAFT_TAG" >> $GITHUB_OUTPUT
          else
            echo "No existing draft release found"
            echo "has_draft=false" >> $GITHUB_OUTPUT
          fi

      - name: Categorize PR
        id: categorize
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR Labels: $labels"
          
          # Determine category based on labels (matching release-drafter.yml)
          category="Other Changes"
          
          if echo "$labels" | grep -q "breaking change"; then
            category="Breaking Changes"
          elif echo "$labels" | grep -qE "(feature|enhancement)"; then
            category="Featured Changes"
          elif echo "$labels" | grep -qE "(fix|bugfix|bug)"; then
            category="Bug Fixes"
          elif echo "$labels" | grep -q "documentation"; then
            category="Other Changes"
          fi
          
          echo "category=$category" >> $GITHUB_OUTPUT
          echo "Categorized as: $category"

      - name: Update CHANGELOG.md
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          CATEGORY="${{ steps.categorize.outputs.category }}"
          HAS_DRAFT="${{ steps.check-draft.outputs.has_draft }}"
          DRAFT_TAG="${{ steps.check-draft.outputs.draft_tag }}"
          
          # Format the changelog entry
          CHANGE_ENTRY="- $PR_TITLE @$PR_AUTHOR [#$PR_NUMBER]"
          
          echo "Adding entry: $CHANGE_ENTRY"
          echo "Category: $CATEGORY"
          echo "Has draft release: $HAS_DRAFT"
          if [ "$HAS_DRAFT" == "true" ]; then
            echo "Draft tag: $DRAFT_TAG"
          fi
          
          # Use Python script to update changelog with proper logic
          python3 << 'EOF'
          import re
          import sys
          import os
          
          # Read the current changelog
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              content = "# Changelog\n\n"
          
          change_entry = os.environ.get('CHANGE_ENTRY', '')
          category = os.environ.get('CATEGORY', '')
          has_draft = os.environ.get('HAS_DRAFT', 'false')
          draft_tag = os.environ.get('DRAFT_TAG', '')
          
          if not change_entry or not category:
              print("Missing environment variables")
              sys.exit(1)
          
          lines = content.split('\n')
          new_lines = []
          added_entry = False
          
          if has_draft == 'true' and draft_tag:
              # There's a draft release - add content to that version section
              print(f"Adding to existing draft version: {draft_tag}")
              target_header = f"## [{draft_tag}]"
              
              in_target_version = False
              found_category = False
              
              for i, line in enumerate(lines):
                  if line.startswith(target_header):
                      new_lines.append(line)
                      in_target_version = True
                  elif in_target_version and line.startswith("## ") and not line.startswith(target_header):
                      # End of target version section
                      if not added_entry:
                          if not found_category:
                              # Add our category and entry before this section
                              new_lines.extend(["", f"### {category}", "", change_entry])
                          else:
                              # Add entry to existing category (should be handled above)
                              new_lines.append(change_entry)
                      new_lines.extend(["", line])
                      in_target_version = False
                  elif in_target_version and line == f"### {category}":
                      # Found our target category in the version
                      new_lines.append(line)
                      found_category = True
                      
                      # Look ahead to find where to insert
                      j = i + 1
                      
                      # Skip empty line after header if it exists
                      if j < len(lines) and lines[j] == "":
                          new_lines.append("")
                          j += 1
                      elif j < len(lines):
                          # No empty line after header, add one
                          new_lines.append("")
                      
                      # Insert our entry before any existing entries
                      new_lines.append(change_entry)
                      added_entry = True
                      
                      # Continue from where we left off
                      i = j - 1  # Will be incremented by loop
                  elif in_target_version and line.startswith("### ") and not found_category:
                      # Found different category before ours in version, insert our category
                      new_lines.extend([f"### {category}", "", change_entry, "", line])
                      found_category = True
                      added_entry = True
                  elif in_target_version and line.startswith("**Full Changelog**") and not added_entry:
                      # Add entry before the full changelog link
                      if not found_category:
                          new_lines.extend([f"### {category}", "", change_entry, "", line])
                      else:
                          new_lines.extend([change_entry, "", line])
                      added_entry = True
                  else:
                      # Regular line, just add it
                      new_lines.append(line)
              
              # If we're still in target version at end and haven't added entry
              if in_target_version and not added_entry:
                  if not found_category:
                      new_lines.extend(["", f"### {category}", "", change_entry])
                  else:
                      new_lines.append(change_entry)
                      
          else:
              # No draft release - use Unreleased section
              print("Adding to Unreleased section")
              
              # Check if we need to create Unreleased section
              if "## [Unreleased]" not in content:
                  # Add new Unreleased section after main header
                  header_found = False
                  for line in lines:
                      new_lines.append(line)
                      if line.startswith("# ") and not header_found:
                          header_found = True
                          new_lines.extend([
                              "",
                              "## [Unreleased]",
                              "",
                              f"### {category}",
                              "",
                              change_entry,
                              ""
                          ])
                          added_entry = True
                          break
              else:
                  # Process existing content for Unreleased section
                  in_unreleased = False
                  found_category = False
                  
                  for i, line in enumerate(lines):
                      if line == "## [Unreleased]":
                          new_lines.append(line)
                          in_unreleased = True
                      elif line.startswith("## ") and in_unreleased:
                          # End of Unreleased section
                          if not added_entry:
                              if not found_category:
                                  new_lines.extend(["", f"### {category}", "", change_entry])
                              else:
                                  new_lines.append(change_entry)
                          new_lines.extend(["", line])
                          in_unreleased = False
                      elif in_unreleased and line == f"### {category}":
                          # Found our target category
                          new_lines.append(line)
                          found_category = True
                          
                          # Look ahead to find where to insert
                          j = i + 1
                          
                          # Skip empty line after header if it exists
                          if j < len(lines) and lines[j] == "":
                              new_lines.append("")
                              j += 1
                          elif j < len(lines):
                              # No empty line after header, add one
                              new_lines.append("")
                          
                          # Insert our entry at the top
                          new_lines.append(change_entry)
                          added_entry = True
                          
                          i = j - 1  # Will be incremented by loop
                      elif in_unreleased and line.startswith("### ") and not found_category:
                          # Found different category before ours, insert our category
                          new_lines.extend([f"### {category}", "", change_entry, "", line])
                          found_category = True
                          added_entry = True
                      else:
                          # Regular line, just add it
                          new_lines.append(line)
                  
                  # If we're still in unreleased and haven't added entry
                  if in_unreleased and not added_entry:
                      if not found_category:
                          new_lines.extend(["", f"### {category}", "", change_entry])
                      else:
                          new_lines.append(change_entry)
          
          # Clean up excessive blank lines while maintaining structure
          final_lines = []
          prev_line = ""
          for line in new_lines:
              # Avoid more than one consecutive empty line
              if line == "" and prev_line == "":
                  continue
              final_lines.append(line)
              prev_line = line
          
          # Ensure file ends with single newline
          content = '\n'.join(final_lines)
          if not content.endswith('\n'):
              content += '\n'
          
          # Write the updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          
          print("Changelog updated successfully")
          print(f"Added: {change_entry}")
          print(f"To category: {category}")
          if has_draft == 'true':
              print(f"In version section: {draft_tag}")
          else:
              print("In Unreleased section")
          EOF
        env:
          CHANGE_ENTRY: "- ${{ github.event.pull_request.title }} @${{ github.event.pull_request.user.login }} [#${{ github.event.pull_request.number }}]"
          CATEGORY: ${{ steps.categorize.outputs.category }}
          HAS_DRAFT: ${{ steps.check-draft.outputs.has_draft }}
          DRAFT_TAG: ${{ steps.check-draft.outputs.draft_tag }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "Update CHANGELOG.md for PR #${{ github.event.pull_request.number }}"
            git push
            echo "Changelog updated successfully"
          fi