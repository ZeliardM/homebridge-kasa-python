name: Update Changelog

# This workflow automatically updates CHANGELOG.md when PRs are merged to the main branch.
# It categorizes changes based on PR labels and maintains the Keep a Changelog format
# that the changelog-release workflow expects.
#
# The workflow is simplified to always add entries to an "Unreleased" section, which
# gets converted to actual version numbers when releases are published.

on:
  pull_request:
    types: [closed]
    branches: [latest]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Categorize PR
        id: categorize
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR Labels: $labels"
          
          # Determine category based on labels (matching release-drafter.yml)
          category="Other Changes"
          
          if echo "$labels" | grep -q "breaking change"; then
            category="Breaking Changes"
          elif echo "$labels" | grep -qE "(feature|enhancement)"; then
            category="Featured Changes"
          elif echo "$labels" | grep -qE "(fix|bugfix|bug)"; then
            category="Bug Fixes"
          elif echo "$labels" | grep -q "documentation"; then
            category="Other Changes"
          fi
          
          echo "category=$category" >> $GITHUB_OUTPUT
          echo "Categorized as: $category"

      - name: Update CHANGELOG.md
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          CATEGORY="${{ steps.categorize.outputs.category }}"
          
          # Format the changelog entry
          CHANGE_ENTRY="- $PR_TITLE @$PR_AUTHOR [#$PR_NUMBER]"
          
          echo "Adding entry: $CHANGE_ENTRY"
          echo "Category: $CATEGORY"
          
          # Use Python script to update changelog - much simpler than bash parsing
          python3 << 'EOF'
          import re
          import sys
          
          # Read the current changelog
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              content = "# Changelog\n\n"
          
          change_entry = "$CHANGE_ENTRY"
          category = "$CATEGORY"
          
          # Check if Unreleased section exists
          if "## [Unreleased]" not in content:
              # Add new Unreleased section at the top
              if content.startswith("# Changelog\n"):
                  insertion_point = len("# Changelog\n\n")
              else:
                  content = "# Changelog\n\n" + content
                  insertion_point = len("# Changelog\n\n")
              
              unreleased_section = f"## [Unreleased]\n\n### {category}\n\n{change_entry}\n\n"
              content = content[:insertion_point] + unreleased_section + content[insertion_point:]
          else:
              # Find the Unreleased section and add to appropriate category
              lines = content.split('\n')
              new_lines = []
              in_unreleased = False
              found_category = False
              added_entry = False
              
              for i, line in enumerate(lines):
                  if line == "## [Unreleased]":
                      new_lines.append(line)
                      in_unreleased = True
                  elif line.startswith("## ") and in_unreleased:
                      # End of Unreleased section
                      if not added_entry:
                          if not found_category:
                              new_lines.extend(["", f"### {category}", "", change_entry])
                          else:
                              new_lines.append(change_entry)
                      new_lines.extend(["", line])
                      in_unreleased = False
                  elif in_unreleased and line == f"### {category}":
                      new_lines.append(line)
                      found_category = True
                  elif in_unreleased and found_category and line.startswith("- "):
                      # Add new entry before existing entries in this category
                      if not added_entry:
                          new_lines.extend([change_entry, line])
                          added_entry = True
                      else:
                          new_lines.append(line)
                  elif in_unreleased and found_category and line == "" and not added_entry:
                      # Empty line after category header
                      new_lines.extend([line, change_entry])
                      added_entry = True
                  else:
                      new_lines.append(line)
              
              # If we're still in unreleased and haven't added entry
              if in_unreleased and not added_entry:
                  if not found_category:
                      new_lines.extend(["", f"### {category}", "", change_entry])
                  else:
                      new_lines.append(change_entry)
              
              content = '\n'.join(new_lines)
          
          # Write the updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          
          print("Changelog updated successfully")
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "Update CHANGELOG.md for PR #${{ github.event.pull_request.number }}"
            git push
            echo "Changelog updated successfully"
          fi