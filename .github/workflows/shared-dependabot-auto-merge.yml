---
name: Dependabot Auto-Merge

on:
  workflow_call: {}

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
  PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
  PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
  PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-Merge Dependabot Pull Request
    runs-on: ubuntu-26.04
    outputs:
      is_merged: ${{ steps.merge_output.outputs.is_merged }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Safety from Labels
        id: safety
        shell: bash
        run: |
          set -euo pipefail
          LABELS="$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$PULL_REQUEST_NUMBER"/labels --jq '.[].name' || true)"
          block=true
          if ! printf '%s\n' "$LABELS" | grep -qi '^dependency-major$'; then
            block=false
          fi
          echo "block=$block" >> "$GITHUB_OUTPUT"

      - name: Build Sticky Comment
        id: build_sticky
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.safety.outputs.block }}" = "false" ]; then
            {
              echo "✅ Dependabot Update is Safe and will be Auto-Merged once the Pull Request Build passes."
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT -->"
            } > body.txt
          else
            {
              echo "⚠️ Dependabot Update Requires Manual Review."
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT -->"
            } > body.txt
          fi

      - name: Upsert Sticky Comment
        id: upsert_sticky
        # The comment is informational; failing to post it must not block the merge.
        continue-on-error: true
        uses: ./.github/actions/sticky-comment
        with:
          number: ${{ env.PULL_REQUEST_NUMBER }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT -->"
          body_file: body.txt

      - name: Wait for the Pull Request Build
        id: build
        if: steps.safety.outcome == 'success' && steps.safety.outputs.block == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # Merge only a commit whose Pull Request Build passed. The build covers every Node and
          # Python version the plugin supports, and an update can break one of them (quart 0.23
          # needs Python 3.13). A new commit gets its own run of this workflow.
          max_wait=${BUILD_WAIT_SECONDS:-1800}
          interval=${BUILD_POLL_SECONDS:-20}
          head_oid="$(gh pr view "$PULL_REQUEST_URL" --json headRefOid --jq .headRefOid)"
          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/pull-request-build.yml/runs"
          waited=0
          while :; do
            run="$(gh api "${runs_api}?head_sha=${head_oid}&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | [.status, (.conclusion // "none"), .html_url] | @tsv' || true)"
            IFS=$'\t' read -r status conclusion url <<< "$run"
            if [ "$status" = "completed" ]; then
              break
            fi
            current="$(gh pr view "$PULL_REQUEST_URL" --json headRefOid --jq .headRefOid || echo "$head_oid")"
            if [ "$current" != "$head_oid" ]; then
              echo "::notice::The branch changed while waiting for the build; the run for the new commit merges it."
              exit 0
            fi
            if [ "$waited" -ge "$max_wait" ]; then
              echo "::error::No finished Pull Request Build for ${head_oid} after ${max_wait} s. Merge it by hand once the build passes."
              exit 1
            fi
            sleep "$interval"
            waited=$(( waited + interval ))
          done
          if [ "$conclusion" != "success" ]; then
            echo "::error::The Pull Request Build for ${head_oid} ended with '${conclusion}', so it is not merged: ${url}"
            exit 1
          fi
          echo "::notice::The Pull Request Build passed for ${head_oid}: ${url}"
          echo "head=${head_oid}" >> "$GITHUB_OUTPUT"

      - name: Auto-Merge Pull Request
        id: auto_merge
        if: steps.build.outputs.head != ''
        shell: bash
        env:
          BUILT_HEAD: ${{ steps.build.outputs.head }}
        run: |
          set -euo pipefail
          # Dependabot opens several pull requests at once. Each merge moves beta, and GitHub then
          # rechecks the others for a few seconds, so wait for that check and retry instead of
          # giving up. A real conflict is left to Dependabot, whose rebase starts a new run.
          max_attempts=${MAX_ATTEMPTS:-16}
          sleep_seconds=${SLEEP_SECONDS:-10}
          start_head="$BUILT_HEAD"
          tmp_err="$(mktemp)"
          for attempt in $(seq 1 "$max_attempts"); do
            if [ "$attempt" -gt 1 ]; then
              # Jitter keeps runs that started together from retrying in lockstep.
              sleep $(( sleep_seconds + RANDOM % (sleep_seconds + 1) ))
            fi
            if ! pr_info="$(gh pr view "$PULL_REQUEST_URL" --json state,mergeable,mergeStateStatus,headRefOid \
              --jq '[.state, .mergeable, .mergeStateStatus, .headRefOid] | @tsv' 2>"$tmp_err")"; then
              echo "::notice::Attempt ${attempt}/${max_attempts}: could not read the pull request: $(tr '\n' ' ' < "$tmp_err")"
              continue
            fi
            IFS=$'\t' read -r pr_state mergeable merge_state head_oid <<< "$pr_info"
            start_head="${start_head:-$head_oid}"
            echo "::notice::Attempt ${attempt}/${max_attempts}: state=${pr_state}, mergeable=${mergeable}, mergeStateStatus=${merge_state}"

            if [ "$pr_state" = "MERGED" ]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$pr_state" != "OPEN" ]; then
              echo "::notice::The pull request is ${pr_state}; nothing to merge."
              exit 0
            fi
            if [ "$head_oid" != "$start_head" ]; then
              echo "::notice::The branch changed during this run; the run for the new commit merges it."
              exit 0
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "::warning::The pull request conflicts with beta; Dependabot rebases it and the next run merges it."
              exit 0
            fi
            if [ "$mergeable" != "MERGEABLE" ]; then
              continue
            fi
            if gh pr merge --squash --match-head-commit "$head_oid" "$PULL_REQUEST_URL" 2>"$tmp_err"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Merge attempt failed: $(tr '\n' ' ' < "$tmp_err")"
          done
          # A merge that GitHub applied but reported as failed on the last attempt still counts.
          if [ "$(gh pr view "$PULL_REQUEST_URL" --json state --jq .state 2>/dev/null || true)" = "MERGED" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Not merged after ${max_attempts} attempts. Merge it by hand, or comment '@dependabot rebase' to try again."
          exit 1

      - name: Set Merge Result Output
        id: merge_output
        if: always()
        shell: bash
        env:
          STEP_MERGED: ${{ steps.auto_merge.outputs.merged }}
        run: |
          set -euo pipefail
          # The merge step exits 0 without merging on a conflict, a closed pull request or a new
          # commit, so only an actual merge (or a merged pull request) counts here.
          pr_state="$(gh pr view "$PULL_REQUEST_URL" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          if [ "$pr_state" = "MERGED" ] || [ "$STEP_MERGED" = "true" ]; then
            echo "is_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_merged=false" >> "$GITHUB_OUTPUT"
          fi

  post-merge-release:
    name: Update CHANGELOG.md and Release from Dependabot Merge
    runs-on: ubuntu-26.04
    needs: auto-merge
    if: ${{ !cancelled() && needs.auto-merge.outputs.is_merged == 'true' }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 26
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Python 3.15
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Fetch current labels for Pull Request
        id: fetch-labels
        shell: bash
        run: |
          set -euo pipefail
          labels_json="$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$PULL_REQUEST_NUMBER"/labels --jq '.[].name' | jq -R . | jq -s .)"
          {
            echo 'labels<<EOF'
            echo "$labels_json"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Serialize Labels
        id: labels
        uses: ./.github/actions/serialize-labels
        with:
          labels_json: ${{ steps.fetch-labels.outputs.labels }}

      - name: Sync Local beta, Update CHANGELOG.md, and Create/Update Release
        id: sync-update-release
        shell: bash
        env:
          MODE: pr-merge
          PULL_REQUEST_LABELS: ${{ steps.labels.outputs.path }}
        run: |
          set -euo pipefail
          PULL_REQUEST_BRANCH="$(gh pr view "$PULL_REQUEST_NUMBER" --json baseRefName --jq .baseRefName)"
          export PULL_REQUEST_BRANCH
          # Several of these run at once after a Dependabot burst. Each push race leaves one winner
          # per round and the others re-sync and retry, so allow more rounds than a burst has PRs.
          MAX_ATTEMPTS=${MAX_ATTEMPTS:-8}
          BASE_SLEEP=${BASE_SLEEP:-5}
          JITTER=${JITTER:-10}
          attempt=1
          echo "::notice::Starting sync+release_manager loop (max ${MAX_ATTEMPTS} attempts)"
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            attempt_status=0
            echo "::notice::Attempt ${attempt} of ${MAX_ATTEMPTS}"
            echo "::notice::Syncing local beta -> origin/beta"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git fetch origin beta --depth=1; then
              echo "::warning::git fetch failed on attempt ${attempt}"
              attempt_status=1
            elif ! git checkout -B beta origin/beta; then
              echo "::warning::git checkout failed on attempt ${attempt}"
              attempt_status=1
            elif ! git reset --hard origin/beta; then
              echo "::warning::git reset failed on attempt ${attempt}"
              attempt_status=1
            elif ! git clean -fd; then
              echo "::warning::git clean failed on attempt ${attempt}"
              attempt_status=1
            fi

            if [ "$attempt_status" -eq 0 ]; then
              echo "::notice::Running release_manager.py (MODE=${MODE})"
              if ! python3 .github/scripts/release_manager.py; then
                echo "::warning::release_manager.py failed on attempt ${attempt}"
                attempt_status=1
              fi
            else
              echo "::notice::Skipping release_manager.py because sync failed on attempt ${attempt}"
            fi

            if [ "$attempt_status" -eq 0 ]; then
              echo "::notice::release_manager.py succeeded on attempt ${attempt}"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep_sec=$(( BASE_SLEEP * attempt + (RANDOM % JITTER) ))
              echo "::notice::Retrying in ${sleep_sec}s (including jitter) ..."
              sleep "${sleep_sec}"
            fi
            attempt=$(( attempt + 1 ))
          done
          echo "::error::All ${MAX_ATTEMPTS} attempts to sync+update CHANGELOG failed. Manual intervention required."
          exit 1
