---
name: Dependabot Auto-Merge

on:
  workflow_call: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
  PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref }}
  PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
  PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
  PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-Merge Dependabot Pull Request
    runs-on: ubuntu-latest
    outputs:
      is_merged: ${{ steps.merge_output.outputs.is_merged }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure jq
        id: ensure-jq
        uses: ./.github/actions/ensure-jq

      - name: Determine Safety from Labels
        id: safety
        shell: bash
        run: |
          set -euo pipefail
          LABELS="$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$PULL_REQUEST_NUMBER"/labels --jq '.[].name' || true)"
          block=true
          if ! printf '%s\n' "$LABELS" | grep -qi '^dependency-major$'; then
            block=false
          fi
          echo "block=$block" >> "$GITHUB_OUTPUT"

      - name: Build Sticky Comment
        id: build_sticky
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.safety.outputs.block }}" = "false" ]; then
            {
              echo "✅ Dependabot Update is Safe and will be Auto-Merged."
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT -->"
            } > body.txt
          else
            {
              echo "⚠️ Dependabot Update Requires Manual Review."
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT -->"
            } > body.txt
          fi

      - name: Upsert Sticky Comment
        id: upsert_sticky
        uses: ./.github/actions/sticky-comment
        with:
          number: ${{ env.PULL_REQUEST_NUMBER }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT -->"
          body_file: body.txt

      - name: Auto-Merge Pull Request
        id: auto_merge
        if: steps.safety.outcome == 'success' && steps.safety.outputs.block == 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PULL_REQUEST_URL"

      - name: Set Merge Result Output
        id: merge_output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.auto_merge.outcome }}" = "success" ]; then
            echo "is_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_merged=false" >> "$GITHUB_OUTPUT"
          fi

  post-merge-release:
    name: Update CHANGELOG.md and Release from Dependabot Merge
    runs-on: ubuntu-latest
    needs: auto-merge
    if: needs.auto-merge.outputs.is_merged == 'true'
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 22
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python 3.12
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ensure jq
        id: ensure-jq
        uses: ./.github/actions/ensure-jq

      - name: Fetch current labels for Pull Request
        id: fetch-labels
        shell: bash
        run: |
          set -euo pipefail
          labels_json="$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$PULL_REQUEST_NUMBER"/labels --jq '.[].name' | jq -R . | jq -s .)"
          echo "labels=$labels_json" >> "$GITHUB_OUTPUT"

      - name: Serialize Labels
        id: labels
        uses: ./.github/actions/serialize-labels
        with:
          labels_json: ${{ steps.fetch-labels.outputs.labels }}

      - name: Update CHANGELOG.md and Draft Release
        shell: bash
        env:
          MODE: pr-merge
          PULL_REQUEST_LABELS: ${{ steps.labels.outputs.path }}
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py
