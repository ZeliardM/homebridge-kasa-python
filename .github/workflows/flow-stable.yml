name: Stable Release Flow

on:
  pull_request:
    types: [closed]
    branches: [latest]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      convert_beta_version:
        description: 'Base stable version to convert (e.g. v2.9.0 converts all v2.9.0-beta.*)'
        required: false
        type: string
      confirm_conversion:
        description: 'Type CONFIRM to proceed with conversion'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  convert-betas:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.convert_beta_version != '' && github.event.inputs.confirm_conversion == 'CONFIRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert betas to stable draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/release_manager.py convert-to-stable \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --version "${{ github.event.inputs.convert_beta_version }}"

  finalize-stable:
    if: github.event_name == 'release' && github.event.release.prerelease == false && !contains(github.event.release.tag_name, 'beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/release_manager.py publish-stable \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --version "${{ github.event.release.tag_name }}" \
            --release-body "${{ github.event.release.body }}"
