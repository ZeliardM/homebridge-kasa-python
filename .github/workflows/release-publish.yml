---
name: Release Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  detect-fork:
    name: Detect Fork
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork-context.outputs.is_fork }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Fork Context
        id: detect-fork-context
        uses: ./.github/actions/detect-fork

  prepare:
    name: Validate Environment
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false'
    steps:
      - name: Validate Environment
        id: validate
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL is required}"

  finalize_release:
    name: Finalize CHANGELOG.md and Release
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.result == 'success'
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: Setup Node 24
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Finalize CHANGELOG.md and Release
        id: finalize-release
        shell: bash
        env:
          IS_BETA: ${{ github.event.release.prerelease == true }}
          MODE: finalize
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_manager.py

  build_lint_test:
    name: Build, Lint, and Test
    needs: finalize_release
    if: needs.finalize_release.result == 'success'
    uses: ./.github/workflows/shared-build-lint-test.yml

  codeql:
    name: CodeQL Analysis
    needs: build_lint_test
    if: needs.build_lint_test.result == 'success'
    uses: ./.github/workflows/shared-codeql.yml

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: codeql
    if: needs.codeql.result == 'success'
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup Node 24
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Node Dependencies
        id: install-node-deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Publish Package and Handle Rollback
        id: publish
        shell: bash
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'beta' || '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_publish.py

      - name: Notice
        id: notice
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Published on npm - ${{ steps.publish.outputs.NPM_VERSION }}"

  notify_discord:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.result == 'success'
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Post Discord Notification
        id: post
        shell: bash
        env:
          DISCORD_TITLE: ${{ github.event.release.prerelease && 'Kasa Python Beta Release' || 'Kasa Python Release' }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py

  fork-notice:
    name: Fork Notice
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    steps:
      - name: Fork Notice
        id: fork-notice
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice:: This workflow is running in a forked repository. All privileged steps have been skipped."
