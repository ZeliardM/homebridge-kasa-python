---
name: Release Publish (Beta & Stable)

on:
  release:
    types: [published]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  detect-fork:
    name: Detect Fork
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork.outputs.is_fork }}
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Fork Context
        id: detect-fork
        uses: ./.github/actions/detect-fork

  prepare:
    name: Validate Environment
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false'
    steps:
      - name: Validate Environment
        id: validate
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${NPM_TOKEN:?NPM_TOKEN is required}"
          : "${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL is required}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          if ! npm whoami --silent; then
            echo "::error:: NPM Token Invalid or Expired!"
            exit 1
          fi

  finalize_release:
    name: Finalize CHANGELOG.md and Release
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.result == 'success'
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Finalize CHANGELOG.md and Release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_BETA: ${{ github.event.release.prerelease == true }}
          MODE: finalize
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py

  build_lint_test:
    name: Build, Lint, and Test
    needs: finalize_release
    if: needs.finalize_release.result == 'success'
    uses: ./.github/workflows/shared-build-lint-test.yml

  codeql:
    name: CodeQL Analysis
    needs: build_lint_test
    if: needs.build_lint_test.result == 'success'
    uses: ./.github/workflows/shared-codeql.yml

  publish:
    name: Publish to NPM
    needs: codeql
    if: needs.codeql.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Publish Package and Handle Rollback
        id: publish
        shell: bash
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_DIST_TAG: ${{ github.event.release.prerelease && 'beta' || '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_publish.py

      - name: Notice
        run: echo "::notice::Published on npm - ${{ steps.publish.outputs.NPM_VERSION }}"

  notify_discord:
    name: Discord Webhooks
    needs: publish
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/shared-discord-notify.yml
    with:
      title: ${{ github.event.release.prerelease && 'Kasa Python Beta Release' || 'Kasa Python Release' }}
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}

  fork-notice:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fork Notice
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice:: This workflow is running in a forked repository. All privileged steps have been skipped."
