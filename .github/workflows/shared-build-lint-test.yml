name: Build, Lint, and Test

on:
  workflow_call: {}

concurrency:
  group: build-lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_lint_test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson('["20","22","24"]') }}
        python-version: ${{ fromJson('["3.11","3.12","3.13"]') }}
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Node Import Test
        run: |
          node <<'NODE'
          (async () => {
            try {
              await import('./dist/index.js');
              console.log('Node Import OK');
            } catch (e) {
              console.error(e);
              process.exit(1);
            }
          })();
          NODE

      - name: Python Import Test
        run: |
          if [ -f requirements.txt ]; then
            set -e
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              line="$(printf '%s' "$pkg" | sed 's/[[:space:]]//g')"
              [ -z "$line" ] && continue
              case "$line" in \#*) continue ;; esac
              mod="$(printf '%s' "$line" | cut -d'=' -f1 | sed 's/\[.*\]//' | tr '-' '_' )"
              case "$mod" in
                python_kasa) mod="kasa" ;;
              esac
              echo "Import check: $mod"
              python -c "import ${mod}"
            done < requirements.txt
            echo "Python Imports OK"
          fi

      - name: Outdated / Audit
        run: |
          npm list --outdated || true
          npm audit || true