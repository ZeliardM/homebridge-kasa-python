name: NPM Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Optional npm dist-tag to publish under (e.g. "beta")
        required: false
        type: string
    secrets:
      npm_auth_token:
        description: The npm access token used to publish the package
        required: true
    outputs:
      NPM_VERSION:
        value: ${{ jobs.publish_package.outputs.NPM_VERSION }}

jobs:
  publish_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    outputs:
      NPM_VERSION: ${{ steps.publish.outputs.NPM_VERSION }}

    steps:
      - name: Checkout source at tag (or ref)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Publish package and handle rollback
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.npm_auth_token }}
          INPUT_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_publish.py

      - name: Notice
        run: echo "::notice::Published on npm - ${{ steps.publish.outputs.NPM_VERSION }}"