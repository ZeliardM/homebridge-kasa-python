name: Classify & Validate Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/classify_issue.py
          fetch-depth: 0

      - name: Ensure jq
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Classify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo '${{ toJson(github.event.issue) }}' > issue.json
          RESULT="$(ISSUE_JSON="$(cat issue.json)" python .github/scripts/classify_issue.py)"

          NEEDS="$(echo "$RESULT" | jq -r '.needs_info // false')"
          LABEL="$(echo "$RESULT" | jq -r '.applied_label // empty')"
          MSGS="$(echo "$RESULT" | jq -r '.messages | join("; ") // empty')"

          if [ -n "$LABEL" ]; then
            gh issue edit ${{ github.event.issue.number }} --add-label "$LABEL"
          fi

          MARK="<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          REPO="${{ github.repository }}"
          NUM="${{ github.event.issue.number }}"

          if [ "$NEEDS" = "true" ]; then
            gh issue edit "$NUM" --add-label needs-info || true

            {
              echo "⚠️ Additional information required:"
              echo
              echo "$MSGS"
              echo
              echo "$MARK"
            } > body.txt

            CID="$(gh api repos/$REPO/issues/$NUM/comments --paginate \
              --jq '.[] | select(.body | contains("'"$MARK"'")) | .id' | head -n1 || true)"

            if [ -n "$CID" ]; then
              BODY="$(cat body.txt)"
              gh api repos/$REPO/issues/comments/$CID -X PATCH -f body="$BODY"
            else
              gh issue comment "$NUM" --body-file body.txt
            fi
          else
            gh issue edit "$NUM" --remove-label needs-info || true

            CID="$(gh api repos/$REPO/issues/$NUM/comments --paginate \
              --jq '.[] | select(.body | contains("'"$MARK"'")) | .id' | head -n1 || true)"
            if [ -n "$CID" ]; then
              gh api repos/$REPO/issues/comments/$CID -X DELETE || true
            fi