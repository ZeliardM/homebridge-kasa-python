name: Classify & Validate Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (classifier script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/classify_issue.py
          fetch-depth: 0

      - name: Run classification
        id: classify
        run: |
          echo '${{ toJson(github.event.issue) }}' > issue.json
          python .github/scripts/classify_issue.py issue.json > result.log
          cat result.log
          if grep -q "NEEDS_INFO=1" result.log; then
            echo "needs_info=true" >> $GITHUB_OUTPUT
          else
            echo "needs_info=false" >> $GITHUB_OUTPUT
          fi
          # Extract added label if any
          ADDED=$(grep "^APPLIED_LABEL=" result.log | cut -d= -f2 || true)
          if [ -n "$ADDED" ]; then
            echo "applied_label=$ADDED" >> $GITHUB_OUTPUT
          fi

      - name: Apply needs-info label & comment
        if: steps.classify.outputs.needs_info == 'true'
        run: |
          gh issue edit $NUMBER --add-label needs-info
          gh issue comment $NUMBER --body "⚠️ Additional information required. Please complete missing sections. (The needs-info label was added automatically.)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}

      - name: Acknowledge classification
        if: steps.classify.outputs.needs_info == 'false' && steps.classify.outputs.applied_label != ''
        run: |
          gh issue comment $NUMBER --body "✅ Classified as **${{ steps.classify.outputs.applied_label }}**."
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NUMBER: ${{ github.event.issue.number }}
