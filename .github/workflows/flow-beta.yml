name: Beta Release Flow

on:
  pull_request:
    types: [closed]
    branches: [beta]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Serialize PR labels to file
        id: labels
        uses: ./.github/actions/serialize-pr-labels
        with:
          labels_json: ${{ toJson(github.event.pull_request.labels.*.name) }}

      - name: Update changelog, beta draft, and align package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          DELETE_DRAFT_STABLE_TAG: 'true'
          DELETE_DRAFT_BETA_TAG: 'true'
          NPM_VERIFY_PUBLISHED_BETA: 'true'
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py pr-merged \
            --github-token "${GITHUB_TOKEN}" \
            --repo "${REPO}" \
            --pr-title "${PR_TITLE}" \
            --pr-author "${PR_AUTHOR}" \
            --pr-number "${PR_NUMBER}" \
            --pr-labels-file "${{ steps.labels.outputs.path }}" \
            --base-branch "${BASE_BRANCH}"

  finalize-beta:
    if: github.event_name == 'release' && github.event.release.prerelease == true && contains(github.event.release.tag_name, 'beta') && github.event.release.target_commitish == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Finalize beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py publish-beta \
            --github-token "${GITHUB_TOKEN}" \
            --repo "${REPO}" \
            --version "${TAG}"