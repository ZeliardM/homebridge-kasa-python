name: Beta Release Flow

on:
  pull_request:
    types: [closed]
    branches: [beta]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Write PR labels to file (safe serialization)
        run: |
          mkdir -p .github
          printf '%s\n' '${{ toJson(github.event.pull_request.labels.*.name) }}' > .github/pr-labels.json

      - name: Update changelog, beta draft, and align package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          DELETE_DRAFT_STABLE_TAG: 'true'
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py pr-merged \
            --github-token "${GITHUB_TOKEN}" \
            --repo "${REPO}" \
            --pr-title "${PR_TITLE}" \
            --pr-author "${PR_AUTHOR}" \
            --pr-number "${PR_NUMBER}" \
            --pr-labels-file ".github/pr-labels.json" \
            --base-branch "${BASE_BRANCH}"

  finalize-beta:
    if: github.event_name == 'release' && github.event.release.prerelease == true && contains(github.event.release.tag_name, 'beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Finalize beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python .github/scripts/release_manager.py publish-beta \
            --github-token "${GITHUB_TOKEN}" \
            --repo "${REPO}" \
            --version "${TAG}"