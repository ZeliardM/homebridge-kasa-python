name: Discord Notification

on:
  workflow_call:
    inputs:
      title:
        description: Title for the Discord embed
        required: true
        type: string
      status:
        description: Status shown by the Discord action (e.g., Success, Failure)
        required: false
        type: string
        default: Success
      description:
        description: Optional custom description prefix (if empty, will inject 'Version `<tag>`')
        required: false
        type: string
        default: ""
      username:
        description: Username for the Discord bot
        required: false
        type: string
        default: Homebridge
      avatar_url:
        description: Avatar URL for the Discord bot
        required: false
        type: string
        default: https://raw.githubusercontent.com/homebridge/branding/latest/logos/homebridge-color-round-stylized.png
      color:
        description: Embed color (Homebridge purple default)
        required: false
        type: string
        default: "4726621"
      nodetail:
        description: Whether to hide details section
        required: false
        type: boolean
        default: false
      nocontext:
        description: Whether to hide context (repo/ref/event)
        required: false
        type: boolean
        default: false
      notimestamp:
        description: Whether to hide timestamp
        required: false
        type: boolean
        default: false
    secrets:
      discord_webhook:
        description: Discord webhook URL
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Get Discord Payload
        id: webhook
        uses: sarisia/actions-status-discord@v1
        with:
          status: ${{ inputs.status }}
          title: ${{ inputs.title }}
          description: ${{ inputs.description != '' && inputs.description || format('Version `{0}`', github.event.release.tag_name) }}
          url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
          username: ${{ inputs.username }}
          avatar_url: ${{ inputs.avatar_url }}
          color: ${{ inputs.color }}
          nodetail: ${{ inputs.nodetail }}
          nocontext: ${{ inputs.nocontext }}
          notimestamp: ${{ inputs.notimestamp }}
          nofail: false
          ack_no_webhook: true

      - name: Build trimmed Event field value
        id: release_notes
        run: |
          python3 .github/scripts/discord_tools.py trim

      - name: Edit payload with trimmed release notes
        id: edit_payload
        env:
          WEBHOOK_PAYLOAD: ${{ steps.webhook.outputs.payload }}
          EVENT_VALUE: ${{ steps.release_notes.outputs.body }}
        run: |
          python3 .github/scripts/discord_tools.py edit-payload

      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.discord_webhook }}
          WEBHOOK_PAYLOAD: ${{ steps.edit_payload.outputs.payload }}
        run: |
          python3 .github/scripts/discord_tools.py post