name: Discord Notification

on:
  workflow_call:
    inputs:
      title:
        description: Title for the Discord embed
        required: true
        type: string
      status:
        description: Status shown by the Discord action (e.g., Success, Failure)
        required: false
        type: string
        default: Success
      description:
        description: Optional custom description prefix (if empty, will inject 'Version `<tag>`')
        required: false
        type: string
        default: ""
      username:
        description: Username for the Discord bot
        required: false
        type: string
        default: Homebridge
      avatar_url:
        description: Avatar URL for the Discord bot
        required: false
        type: string
        default: https://raw.githubusercontent.com/homebridge/branding/latest/logos/homebridge-color-round-stylized.png
      color:
        description: Embed color (Homebridge purple default)
        required: false
        type: string
        default: "4726621"
      nodetail:
        description: Whether to hide details section (also disables status prefix)
        required: false
        type: boolean
        default: false
      nocontext:
        description: Whether to hide context (repo/ref/event/actor/workflow)
        required: false
        type: boolean
        default: false
      notimestamp:
        description: Whether to hide timestamp
        required: false
        type: boolean
        default: false
    secrets:
      webhook:
        description: Discord webhook URL
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Send Discord notification
        shell: bash
        run: |
          set -euo pipefail

          args=( \
            --webhook '${{ secrets.webhook }}' \
            --status '${{ inputs.status }}' \
            --title '${{ inputs.title }}' \
            --username '${{ inputs.username }}' \
            --avatar-url '${{ inputs.avatar_url }}' \
            --color '${{ inputs.color }}' \
            --reserve-name-line \
            --content-max 900 \
            --hard-max 1024 \
          )

          if [ -n "${{ inputs.description }}" ]; then
            args+=( --description-prefix '${{ inputs.description }}' )
          fi

          if [ "${{ inputs.nodetail }}" = "true" ]; then
            args+=( --nodetail )
          fi
          if [ "${{ inputs.nocontext }}" = "true" ]; then
            args+=( --nocontext )
          fi
          if [ "${{ inputs.notimestamp }}" = "true" ]; then
            args+=( --notimestamp )
          fi

          python3 .github/scripts/discord_notify.py "${args[@]}"