---
name: Stale

on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,enhancement,bug,breaking-change,needs-info'
          exempt-pr-labels: 'pinned,security,work-in-progress,breaking-change'
          exempt-all-pr-assignees: true
          exempt-all-issue-assignees: true
          operations-per-run: 50
          stale-issue-message: |
            This issue is stale after 60 days of inactivity. It will close in 7 days unless updated.
          close-issue-message: |
            Closing due to inactivity. Reopen if still valid.
          stale-pr-message: |
            This PR is stale after 30 days of inactivity. It will close in 7 days unless updated.
          close-pr-message: |
            Closing stale PR. Reopen if you plan to continue.
