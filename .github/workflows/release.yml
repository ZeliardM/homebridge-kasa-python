---
name: Release

# This workflow handles npm publishing for regular releases (not beta releases).
# It is triggered when releases are published and only runs for:
# - Non-prerelease releases (prerelease=false)
# - Releases from the latest branch
# - The official repository only
#
# Beta releases are handled by the beta-release.yml workflow instead.

on:
  release:
    types: [published]

jobs:
  build_lint_test:
    # Only run for non-beta releases on the latest branch
    if: >
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'latest' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build_lint_test
    if: >
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'latest' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    permissions:
      id-token: write
    uses: homebridge/.github/.github/workflows/npm-publish-esm.yml@latest
    secrets:
      npm_auth_token: ${{ secrets.NPM_TOKEN }}

    # Optional Discord notification (commented out)
    # github-releases-to-discord:
