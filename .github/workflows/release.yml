---
name: Release

# This workflow handles the npm publishing and release creation for stable releases.
# Changelog management is handled by the flow-stable.yml workflow.

on:
  release:
    types: [published]

# Only run for non-beta releases on the latest branch
jobs:
  build_lint_test:
    if: >
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'latest' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: ./.github/workflows/build-lint-test.yml

  publish:
    needs: build_lint_test
    if: >
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'latest' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    permissions:
      id-token: write
    uses: homebridge/.github/.github/workflows/npm-publish-esm.yml@latest
    secrets:
      npm_auth_token: ${{ secrets.npm_token }}

  release_to_discord:
    needs: [build_lint_test, publish]
    if: >
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'latest' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "Kasa Python Release"
      description: |
        Version `${{ github.event.release.tag_name }}`
      url: >
        https://github.com/ZeliardM/homebridge-kasa-python/releases/tag/${{ github.event.release.tag_name }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
