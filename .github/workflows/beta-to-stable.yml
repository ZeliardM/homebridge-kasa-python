---
name: Convert Beta to Stable Pull Request

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  detect-fork:
    name: Detect Fork
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork-context.outputs.is_fork }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Fork Context
        id: detect-fork-context
        uses: ./.github/actions/detect-fork

  prepare:
    name: Validate Environment
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false'
    steps:
      - name: Validate Environment
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"

  create-pr:
    name: Create Stable Release Pull Request
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.result == 'success'
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Create Stable Release Pull Request
        id: create-pr
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/beta_to_stable.py

  fork-notice:
    name: Fork Notice
    runs-on: ubuntu-latest
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    steps:
      - name: Fork Notice
        id: fork-notice
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice:: This workflow is running in a forked repository. All privileged steps have been skipped."
