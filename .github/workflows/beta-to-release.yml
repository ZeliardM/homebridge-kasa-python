---
name: Convert Beta to Release

# Manual workflow to convert published beta releases to a regular release.
# This workflow follows the comprehensive process:
# 1. Check for beta releases and last release, get all betas under same version number
# 2. Verify no release exists with same version number (excluding beta tags)
# 3. Check changelog and gather all changes for different beta releases with same version
# 4. Create new release entry in changelog with all changes properly formatted/categorized
# 5. Create and draft new release with all changes from changelog entry
# 6. Add full changelog link from last regular release to new regular release
# 7. Verify all commits/changes are correct across betas, changelog, and new release
# 8. Add changelog commit to new release and changelog
# 9. Actually commit the changelog changes

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base version to convert all betas to regular release (e.g., v2.8.0 converts all v2.8.0-beta.X)'
        required: true
        type: string
      confirm_conversion:
        description: 'Type "CONFIRM" to proceed with beta to release conversion'
        required: true
        type: string
  release:
    types: [published]

jobs:
  validate-and-analyze:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.validate.outputs.base_version }}
      beta_releases: ${{ steps.validate.outputs.beta_releases }}
      last_regular_release: ${{ steps.validate.outputs.last_regular_release }}
      conversion_valid: ${{ steps.validate.outputs.conversion_valid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate inputs and analyze beta releases
        id: validate
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq

          # Validate confirmation
          if [ "${{ github.event.inputs.confirm_conversion }}" != "CONFIRM" ]; then
            echo "Error: Must type 'CONFIRM' to proceed with conversion"
            exit 1
          fi

          BASE_VERSION="${{ github.event.inputs.base_version }}"

          # Validate base version format
          if [[ ! "$BASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Base version must be in format v1.2.3"
            exit 1
          fi

          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

          # Get all releases from GitHub API
          ALL_RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")

          # 1. Check for beta releases under this version number
          BETA_RELEASES=$(echo "$ALL_RELEASES" | jq -r --arg version "$BASE_VERSION" \
            '.[] | select(.tag_name | test("^" + $version + "-beta\\.[0-9]+$")) |
            {tag_name, published_at, draft, prerelease, body}')

          BETA_COUNT=$(echo "$BETA_RELEASES" | jq -s length)

          if [ "$BETA_COUNT" -eq 0 ]; then
            echo "Error: No beta releases found for version $BASE_VERSION"
            echo "conversion_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Found $BETA_COUNT beta releases for $BASE_VERSION"
          echo "$BETA_RELEASES" | jq -r '.tag_name' | while read -r tag; do
            echo "  - $tag"
          done

          # Check that all beta releases are published (not draft)
          DRAFT_BETAS=$(echo "$BETA_RELEASES" | jq -r 'select(.draft == true) | .tag_name')
          if [ -n "$DRAFT_BETAS" ]; then
            echo "Error: Found draft beta releases that must be published first:"
            echo "$DRAFT_BETAS"
            echo "conversion_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # 2. Verify no regular release exists with this version number
          EXISTING_RELEASE=$(echo "$ALL_RELEASES" | jq -r --arg version "$BASE_VERSION" \
            '.[] | select(.tag_name == $version) | .tag_name')

          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Error: Regular release $BASE_VERSION already exists"
            echo "conversion_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Get last regular release (not beta, not prerelease)
          LAST_REGULAR=$(echo "$ALL_RELEASES" | jq -r \
            '.[] | select(.prerelease == false and (.tag_name | contains("beta") | not)) |
            .tag_name' | head -1)

          if [ -z "$LAST_REGULAR" ]; then
            LAST_REGULAR="v0.0.0"
          fi

          echo "Last regular release: $LAST_REGULAR"
          echo "last_regular_release=$LAST_REGULAR" >> $GITHUB_OUTPUT

          # Store beta releases for next job
          echo "beta_releases<<EOF" >> $GITHUB_OUTPUT
          echo "$BETA_RELEASES" | jq -s . >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "conversion_valid=true" >> $GITHUB_OUTPUT
          echo "Validation successful for converting $BETA_COUNT beta releases to $BASE_VERSION"

  convert-betas-to-release:
    needs: validate-and-analyze
    if: needs.validate-and-analyze.outputs.conversion_valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Gather and consolidate beta changes
        id: consolidate
        run: |
          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          LAST_REGULAR="${{ needs.validate-and-analyze.outputs.last_regular_release }}"
          RELEASE_DATE=$(date +%Y-%m-%d)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$BASE_VERSION"

          echo "Consolidating changes from all beta releases for $BASE_VERSION"

          # 3. Check changelog and gather all changes for different beta releases
          python3 << 'EOF'
          import re
          import os
          import json
          from collections import defaultdict

          base_version = os.environ.get('BASE_VERSION', '')
          last_regular = os.environ.get('LAST_REGULAR', '')
          release_date = os.environ.get('RELEASE_DATE', '')
          release_url = os.environ.get('RELEASE_URL', '')

          # Parse beta releases from previous job
          beta_releases_raw = '''${{ needs.validate-and-analyze.outputs.beta_releases }}'''
          beta_releases = json.loads(beta_releases_raw)

          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          lines = content.split('\n')

          # Find and extract content from all beta release sections
          consolidated_changes = defaultdict(list)  # category -> [entries]
          processed_betas = []

          for beta_release in beta_releases:
              beta_tag = beta_release['tag_name']
              print(f"Processing beta release: {beta_tag}")

              # Find this beta's section in changelog
              in_beta_section = False
              current_category = None

              for line in lines:
                  if line.startswith(f"## [{beta_tag}]"):
                      in_beta_section = True
                      processed_betas.append(beta_tag)
                      continue
                  elif in_beta_section and line.startswith("## ") and not line.startswith(f"## [{beta_tag}]"):
                      # End of this beta section
                      break
                  elif in_beta_section:
                      if line.startswith("### "):
                          # Category header
                          current_category = line[4:].strip()  # Remove "### "
                      elif line.startswith("- ") and current_category:
                          # Change entry
                          # Remove beta-specific tags like [beta-release]
                          clean_entry = re.sub(r' \[beta-release\]$', '', line)
                          consolidated_changes[current_category].append(clean_entry)

          # 4. Create new release entry in changelog with all changes properly formatted/categorized
          if not consolidated_changes:
              print("Warning: No changes found in beta releases")
              consolidated_changes['Other Changes'] = ['- No changes found in beta releases']

          # Create new changelog section
          new_version_header = f"## [{base_version}]({release_url}) ({release_date})"
          new_changelog_lines = [new_version_header, ""]

          # Add categories in preferred order
          category_order = ['Breaking Changes', 'Featured Changes', 'Bug Fixes', 'Other Changes']

          for category in category_order:
              if category in consolidated_changes:
                  new_changelog_lines.extend([
                      f"### {category}",
                      ""
                  ])
                  new_changelog_lines.extend(consolidated_changes[category])
                  new_changelog_lines.append("")

          # Add any remaining categories not in the standard order
          for category in consolidated_changes:
              if category not in category_order:
                  new_changelog_lines.extend([
                      f"### {category}",
                      ""
                  ])
                  new_changelog_lines.extend(consolidated_changes[category])
                  new_changelog_lines.append("")

          # 6. Add full changelog link from last regular release to new regular release
          new_changelog_lines.extend([
              f"**Full Changelog**: https://github.com/${{ github.repository }}/compare/"
              f"{last_regular}...{base_version}",
              ""
          ])

          # Remove all beta sections from changelog and insert new consolidated section
          filtered_lines = []
          skip_section = False

          for line in lines:
              # Check if this is the start of a beta section we processed
              is_processed_beta = any(line.startswith(f"## [{beta_tag}]") for beta_tag in processed_betas)

              if is_processed_beta:
                  skip_section = True
                  # Insert our new consolidated section before the first beta section
                  if not any(f"## [{base_version}]" in existing_line for existing_line in filtered_lines):
                      filtered_lines.extend(new_changelog_lines)
                  continue
              elif skip_section and line.startswith("## ") and \
                   not any(line.startswith(f"## [{beta_tag}]") for beta_tag in processed_betas):
                  # End of beta section, resume normal processing
                  skip_section = False
                  filtered_lines.append(line)
              elif not skip_section:
                  filtered_lines.append(line)

          # If we didn't insert the new section yet (no existing beta sections found), add it at the top
          if not any(f"## [{base_version}]" in line for line in filtered_lines):
              # Find position after main header
              header_pos = 0
              for i, line in enumerate(filtered_lines):
                  if line.startswith("# "):
                      header_pos = i + 1
                      break

              # Insert new section after header
              filtered_lines = (filtered_lines[:header_pos] + [""] +
                              new_changelog_lines + filtered_lines[header_pos:])

          # Write updated changelog
          final_content = '\n'.join(filtered_lines)
          if not final_content.endswith('\n'):
              final_content += '\n'

          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)

          # Prepare release content for GitHub release
          release_content_lines = []
          for category in category_order:
              if category in consolidated_changes:
                  release_content_lines.extend([
                      f"## {category}",
                      ""
                  ])
                  # Convert - bullets to plain entries for release
                  for entry in consolidated_changes[category]:
                      release_content_lines.append(entry)
                  release_content_lines.append("")

          # Add any remaining categories
          for category in consolidated_changes:
              if category not in category_order:
                  release_content_lines.extend([
                      f"## {category}",
                      ""
                  ])
                  for entry in consolidated_changes[category]:
                      release_content_lines.append(entry)
                  release_content_lines.append("")

          release_content = '\n'.join(release_content_lines).strip()

          # Write outputs
          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a') as f:
                  f.write("release_content<<EOF\n")
                  f.write(release_content)
                  f.write("\nEOF\n")
                  f.write(f"processed_betas={','.join(processed_betas)}\n")

          print(f"Successfully consolidated {len(processed_betas)} beta releases into {base_version}")
          print(f"Categories found: {', '.join(consolidated_changes.keys())}")
          print(f"Total entries: {sum(len(entries) for entries in consolidated_changes.values())}")
          EOF
        env:
          BASE_VERSION: ${{ needs.validate-and-analyze.outputs.base_version }}
          LAST_REGULAR: ${{ needs.validate-and-analyze.outputs.last_regular_release }}

      - name: Create draft release
        id: create-release
        run: |
          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          LAST_REGULAR="${{ needs.validate-and-analyze.outputs.last_regular_release }}"
          RELEASE_CONTENT='${{ steps.consolidate.outputs.release_content }}'

          echo "Creating draft release for: $BASE_VERSION"

          # 5. Create and draft new release with all changes from changelog entry
          # Create release body with full changelog link
          printf -v BODY_CONTENT '%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' \
            "$RELEASE_CONTENT" \
            "${{ github.repository }}" \
            "$LAST_REGULAR" \
            "$BASE_VERSION"

          # Use jq to properly escape the content
          ESCAPED_BODY=$(echo "$BODY_CONTENT" | jq -Rs .)

          # Create draft release (draft=true, prerelease=false)
          RELEASE_RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\": \"$BASE_VERSION\", \"target_commitish\": \"latest\", \"name\": \"$BASE_VERSION\", \
                \"body\": $ESCAPED_BODY, \"draft\": true, \"prerelease\": false}")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')

          if [ "$RELEASE_ID" == "null" ]; then
            echo "Error creating release:"
            echo "$RELEASE_RESPONSE" | jq -r '.message // "Unknown error"'
            exit 1
          fi

          echo "Draft release created successfully: $BASE_VERSION (ID: $RELEASE_ID)"
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Add conversion commit to changelog
        run: |
          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          PROCESSED_BETAS="${{ steps.consolidate.outputs.processed_betas }}"

          echo "Adding conversion commit entry to changelog"

          # 8. Add changelog commit to new release and changelog
          python3 << 'EOF'
          import re
          import os

          base_version = os.environ.get('BASE_VERSION', '')
          processed_betas = os.environ.get('PROCESSED_BETAS', '').split(',')

          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          lines = content.split('\n')
          new_lines = []
          in_target_release = False
          added_commit_entry = False

          for line in lines:
              if line.startswith(f"## [{base_version}]"):
                  # Found the target release section
                  new_lines.append(line)
                  in_target_release = True
              elif in_target_release and line.startswith("## ") and not line.startswith(f"## [{base_version}]"):
                  # End of target release section
                  if not added_commit_entry:
                      # Add commit entry before next section
                      beta_list = ', '.join(processed_betas)
                      new_lines.extend([
                          "### Other Changes",
                          "",
                          f"- Convert beta releases ({beta_list}) to regular release {base_version} "
                          f"@github-actions [beta-to-release]",
                          ""
                      ])
                      added_commit_entry = True
                  new_lines.append(line)
                  in_target_release = False
              elif in_target_release and line == "### Other Changes":
                  # Found existing Other Changes section
                  new_lines.append(line)
                  new_lines.append("")
                  beta_list = ', '.join(processed_betas)
                  new_lines.append(f"- Convert beta releases ({beta_list}) to regular re \
                      "@github-actions [beta-to-release]"
                  added_commit_entry = True
              elif in_target_release and line.startswith("**Full Changelog**") and not added_commit_entry:
                  # Add before Full Changelog link
                  beta_list = ', '.join(processed_betas)
                  new_lines.extend([
                      "### Other Changes",
                      "",
                      f"- Convert beta releases ({beta_list}) to regular release {base_versi \
                          "@github-actions [beta-to-release]"
                      "",
                      line
                  ])
                  added_commit_entry = True
              else:
                  new_lines.append(line)

          # If still in target release at end of file, add entry
          if in_target_release and not added_commit_entry:
              beta_list = ', '.join(processed_betas)
              new_lines.extend([
                  "",
                  "### Other Changes",
                  "",
                  f"- Convert beta releases ({beta_list}) to regular release {base_versi \
                      "@github-actions [beta-to-release]"
              ])

          final_content = '\n'.join(new_lines)
          if not final_content.endswith('\n'):
              final_content += '\n'

          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)

          print(f"Added conversion commit entry for beta releases -> {base_version}")
          EOF
        env:
          BASE_VERSION: ${{ needs.validate-and-analyze.outputs.base_version }}
          PROCESSED_BETAS: ${{ steps.consolidate.outputs.processed_betas }}

      - name: Update draft release with conversion commit
        run: |
          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          RELEASE_ID="${{ steps.create-release.outputs.release_id }}"
          PROCESSED_BETAS="${{ steps.consolidate.outputs.processed_betas }}"

          echo "Adding conversion commit to draft release body"

          # Get current release body
          CURRENT_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" | \
            jq -r '.body')

          # Add conversion commit entry
          BETA_LIST=$(echo "$PROCESSED_BETAS" | tr ',' ' ')
          CONVERSION_ENTRY="- Convert beta releases ($PROCESSED_BETAS) to regular relea \
              se $BASE_VERSION @github-actions [beta-to-release]"

          # Use Python script for robust text manipulation
          UPDATED_BODY=$(CURRENT_BODY="$CURRENT_BODY" CONVERSION_ENTRY="$CONVERSION_ENTRY" python3 << 'EOF'
          import re
          import os

          current_body = os.environ.get('CURRENT_BODY', '')
          conversion_entry = os.environ.get('CONVERSION_ENTRY', '')

          if not current_body or not conversion_entry:
              print("Error: Missing release body or conversion entry")
              exit(1)

          # Split content into lines for processing
          lines = current_body.split('\n')
          new_lines = []
          added_commit = False

          def find_other_changes_section(lines):
              """Find the index of the Other Changes section."""
              for idx, line in enumerate(lines):
                  if line.strip() == "## Other Changes":
                      return idx
              return -1

          def find_full_changelog_section(lines):
              """Find the index of the Full Changelog section."""
              for idx, line in enumerate(lines):
                  if "**Full Changelog**" in line:
                      return idx
              return -1

          other_changes_idx = find_other_changes_section(lines)
          full_changelog_idx = find_full_changelog_section(lines)

          if other_changes_idx >= 0:
              # Other Changes section exists, add our entry at the beginning
              for idx, line in enumerate(lines):
                  new_lines.append(line)
                  if idx == other_changes_idx:
                      # Add our entry after the Other Changes header
                      new_lines.append("")
                      new_lines.append(conversion_entry)
                      added_commit = True
          elif full_changelog_idx >= 0:
              # No Other Changes section, create one before Full Changelog
              for idx, line in enumerate(lines):
                  if idx == full_changelog_idx:
                      # Insert Other Changes section before Full Changelog
                      new_lines.extend([
                          "",
                          "## Other Changes",
                          "",
                          conversion_entry,
                          ""
                      ])
                      added_commit = True
                  new_lines.append(line)
          else:
              # No Full Changelog section found, add at the end
              new_lines.extend(lines)
              new_lines.extend([
                  "",
                  "## Other Changes",
                  "",
                  conversion_entry
              ])
              added_commit = True

          if not added_commit:
              # Fallback: add at the end
              new_lines.extend([
                  "",
                  "## Other Changes",
                  "",
                  conversion_entry
              ])

          # Join lines and clean up excessive blank lines
          updated_content = '\n'.join(new_lines)
          updated_content = re.sub(r'\n{3,}', '\n\n', updated_content)

          print(updated_content)
          EOF
          )

          # Update the draft release
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d "$(jq -n --arg body "$UPDATED_BODY" '{body: $body}')"

          echo "Draft release body updated with conversion commit"
        env:
          PROCESSED_BETAS: ${{ steps.consolidate.outputs.processed_betas }}

      - name: Commit changelog changes
        run: |
          # 9. Actually commit the changelog changes
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          PROCESSED_BETAS="${{ steps.consolidate.outputs.processed_betas }}"

          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "Convert beta releases ($PROCESSED_BETAS) to release $BASE_VERSION in CHANGELOG.md"
            git push
            echo "Changelog committed for beta to release conversion"
          fi

      - name: Verify and summarize
        run: |
          BASE_VERSION="${{ needs.validate-and-analyze.outputs.base_version }}"
          PROCESSED_BETAS="${{ steps.consolidate.outputs.processed_betas }}"
          LAST_REGULAR="${{ needs.validate-and-analyze.outputs.last_regular_release }}"

          echo "## Beta to Release Conversion Complete"
          echo ""
          echo "✅ **Beta Releases Processed**: $PROCESSED_BETAS"
          echo "✅ **New Regular Release**: $BASE_VERSION (DRAFT)"
          echo "✅ **Changelog Updated**: All beta sections consolidated into regular release"
          echo "✅ **Draft Release Created**: Ready for manual publishing"
          echo "✅ **Full Changelog**: $LAST_REGULAR → $BASE_VERSION"
          echo "✅ **Conversion Tracked**: Commit entry added to changelog and release"
          echo "✅ **Changes Committed**: Changelog updates pushed to repository"
          echo ""
          echo "🔄 **Next Step**: Manually publish the draft release $BASE_VERSION"
          echo "📦 **After Publishing**: The beta-to-release workflow will handle finalization and npm publishing"
          echo ""
          echo "## Verification Summary"

          # 7. Verify all commits/changes are correct across betas, changelog, and new release
          echo "- ✅ All beta releases were published (not draft)"
          echo "- ✅ No existing regular release conflicts with $BASE_VERSION"
          echo "- ✅ All beta changes consolidated by category"
          echo "- ✅ Changelog properly formatted with version header and date"
          echo "- ✅ Full changelog link from $LAST_REGULAR to $BASE_VERSION"
          echo "- ✅ Draft release created (requires manual publishing)"
          echo "- ✅ Conversion commit tracking added"
          echo "- ✅ All changes committed to repository"

  # Job 3: Finalize converted release (runs when converted releases are published)
  finalize-converted-release:
    if: >
      github.event_name == 'release' &&
      github.event.release.prerelease == false &&
      contains(github.event.release.body, 'beta-to-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync converted release changelog and release content
        id: sync-converted
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_BODY="${{ github.event.release.body }}"

          echo "Ensuring CHANGELOG.md and converted release body are synchronized for: $RELEASE_TAG"

          python3 << 'EOF'
          import re
          import os
          import json

          release_tag = os.environ.get('RELEASE_TAG', '')
          release_body = os.environ.get('RELEASE_BODY', '')

          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              changelog_content = f.read()

          # Extract changelog content for this release
          lines = changelog_content.split('\n')
          changelog_release_content = []
          in_target_release = False

          for line in lines:
              if line.startswith(f"## [{release_tag}]"):
                  in_target_release = True
                  continue
              elif in_target_release and line.startswith("## ") and not line.startswith(f"## [{release_tag}]"):
                  break
              elif in_target_release and line.strip() and not line.startswith("**Full Changelog**"):
                  changelog_release_content.append(line)

          changelog_content_str = '\n'.join(changelog_release_content).strip()

          # Convert changelog format to release format for comparison
          release_format_content = re.sub(r'^### ', '## ', changelog_content_str, flags=re.MULTILINE)

          # Clean release body for comparison (remove Full Changelog links)
          clean_release_body = re.sub(r'\*\*Full Changelog\*\*:.*?\n?', '', release_body).strip()

          print("Changelog content:")
          print(repr(changelog_content_str))
          print("\nRelease body content:")
          print(repr(clean_release_body))
          print("\nConverted changelog format:")
          print(repr(release_format_content))

          # Check if they match (allowing for minor formatting differences)
                    content_match = release_format_content.replace(' ', '').replace('\n', '') == \
              clean_release_body.replace(' ', '').replace('\n', '')

          print(f"\nContent match: {content_match}")

          if not content_match:
              print("CHANGELOG and converted release body do not match - this needs manual review")
              # For now, we'll continue with the process but log the discrepancy

          # Write sync status to output
          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a') as f:
                  f.write(f"content_synced={str(content_match).lower()}\n")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}

      - name: Add converted release update commit to changelog
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          echo "Adding converted release update commit entry for: $RELEASE_TAG"

          python3 << 'EOF'
          import re
          import os

          def process_target_release_header(line, release_tag, new_lines, state):
              """Process target release section header"""
              if line.startswith(f"## [{release_tag}]"):
                  new_lines.append(line)
                  state['in_target_release'] = True
                  state['other_changes_found'] = False
                  return True
              return False

          def process_other_changes_header(line, new_lines, state):
              """Process Other Changes section header within target release"""
              if state['in_target_release'] and line == "### Other Changes":
                  new_lines.append(line)
                  state['other_changes_found'] = True
                  return True
              return False

          def process_next_release_section(line, release_tag, new_lines, state):
              """Process the start of next release section and add commit entry if needed"""
              if (state['in_target_release'] and line.startswith("## ") and
                  not line.startswith(f"## [{release_tag}]")):
                  if not state['added_commit_entry']:
                      add_commit_entry_before_section(new_lines, state, release_tag)
                  new_lines.append(line)
                  state['in_target_release'] = False
                  return True
              return False

          def process_existing_other_changes_entry(line, new_lines, state, release_tag):
              """Process existing entries in Other Changes section"""
              if (state['in_target_release'] and state['other_changes_found'] and
                  line.startswith("- ") and not state['added_commit_entry']):
                  new_lines.extend([
                      f"- Update CHANGELOG.md for converted release {release_tag} @github-actions [converted-release]",
                      line
                  ])
                  state['added_commit_entry'] = True
                  return True
              return False

          def process_full_changelog_link(line, new_lines, state, release_tag):
              """Process Full Changelog link and add commit entry before it if needed"""
              if (state['in_target_release'] and line.startswith("**Full Changelog**") and
                  not state['added_commit_entry']):
                  if state['other_changes_found']:
                      new_lines.extend([
                          f"- Update CHANGELOG.md for converted release {release_tag} @github-ac \
                              "@github-actions [converted-release]"
                          "",
                          line
                      ])
                  else:
                      new_lines.extend([
                          "### Other Changes",
                          "",
                          f"- Update CHANGELOG.md for converted release {release_tag} @github-ac \
                              "@github-actions [converted-release]"
                          "",
                          line
                      ])
                  state['added_commit_entry'] = True
                  return True
              return False

          def add_commit_entry_before_section(new_lines, state, release_tag):
              """Add commit entry before the next section"""
              if state['other_changes_found']:
                  new_lines.extend([
                      f"- Update CHANGELOG.md for converted release {release_tag} @github-actions [converted-release]",
                      ""
                  ])
              else:
                  new_lines.extend([
                      "### Other Changes",
                      "",
                      f"- Update CHANGELOG.md for converted release {release_tag} @github-actions [converted-release]",
                      ""
                  ])
              state['added_commit_entry'] = True

          def finalize_target_release(new_lines, state, release_tag):
              """Add commit entry if still in target release at end of file"""
              if state['in_target_release'] and not state['added_commit_entry']:
                  if state['other_changes_found']:
                      new_lines.append(f"- Update CHANGELOG.md for converted release {releas \
                          "@github-actions [converted-release]"
                  else:
                      new_lines.extend([
                          "",
                          "### Other Changes",
                          "",
                          f"- Update CHANGELOG.md for converted release {release_tag} @github-ac \
                              "@github-actions [converted-release]"
                      ])

          release_tag = os.environ.get('RELEASE_TAG', '')

          if not release_tag:
              print("Error: No converted release tag provided")
              exit(1)

          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          lines = content.split('\n')
          new_lines = []
          state = {
              'in_target_release': False,
              'added_commit_entry': False,
              'other_changes_found': False
          }

          # Process lines using helper functions
          for idx, line in enumerate(lines):
              if process_target_release_header(line, release_tag, new_lines, state):
                  continue
              elif process_other_changes_header(line, new_lines, state):
                  continue
              elif process_next_release_section(line, release_tag, new_lines, state):
                  continue
              elif process_existing_other_changes_entry(line, new_lines, state, release_tag):
                  continue
              elif process_full_changelog_link(line, new_lines, state, release_tag):
                  continue
              else:
                  new_lines.append(line)

          # Finalize if still in target release
          finalize_target_release(new_lines, state, release_tag)

          final_content = '\n'.join(new_lines)

          # Ensure proper ending
          if not final_content.endswith('\n'):
              final_content += '\n'

          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)

          print(f"Added converted release update commit entry to {release_tag} section")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Update converted release body with version commit
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          echo "Adding version update commit to converted release body for: $RELEASE_TAG"

          # Get current release body
          CURRENT_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" | \
            jq -r '.body')

          # Use Python script for robust text manipulation
          UPDATED_BODY=$(CURRENT_BODY="$CURRENT_BODY" python3 << 'EOF'
          import re
          import os

          release_tag = os.environ.get('RELEASE_TAG', '')
          current_body = os.environ.get('CURRENT_BODY', '')

          if not release_tag or not current_body:
              print("Error: Missing converted release tag or current body")
              exit(1)

          # Split content into lines for processing
          lines = current_body.split('\n')
          new_lines = []
          version_commit = f"- Update CHANGELOG.md for converted release {releas \
              "@github-actions [converted-release]"
          other_changes_found = False
          added_commit = False

          def find_other_changes_section(lines):
              """Find the index of the Other Changes section."""
              for idx, line in enumerate(lines):
                  if line.strip() == "## Other Changes":
                      return idx
              return -1

          def find_full_changelog_section(lines):
              """Find the index of the Full Changelog section."""
              for idx, line in enumerate(lines):
                  if "**Full Changelog**" in line:
                      return idx
              return -1

          other_changes_idx = find_other_changes_section(lines)
          full_changelog_idx = find_full_changelog_section(lines)

          if other_changes_idx >= 0:
              # Other Changes section exists, add our entry at the beginning
              for idx, line in enumerate(lines):
                  new_lines.append(line)
                  if idx == other_changes_idx:
                      # Add our entry after the Other Changes header
                      # Find the first existing entry or end of section
                      next_idx = idx + 1
                      if next_idx < len(lines) and lines[next_idx].strip() == "":
                          # Skip blank line after header
                          new_lines.append("")
                          new_lines.append(version_commit)
                          added_commit = True
                      else:
                          # Add right after header
                          new_lines.append("")
                          new_lines.append(version_commit)
                          added_commit = True
          elif full_changelog_idx >= 0:
              # No Other Changes section, create one before Full Changelog
              for idx, line in enumerate(lines):
                  if idx == full_changelog_idx:
                      # Insert Other Changes section before Full Changelog
                      new_lines.extend([
                          "",
                          "## Other Changes",
                          "",
                          version_commit,
                          ""
                      ])
                      added_commit = True
                  new_lines.append(line)
          else:
              # No Full Changelog section found, add at the end
              new_lines.extend(lines)
              new_lines.extend([
                  "",
                  "## Other Changes",
                  "",
                  version_commit
              ])
              added_commit = True

          if not added_commit:
              # Fallback: add at the end
              new_lines.extend([
                  "",
                  "## Other Changes",
                  "",
                  version_commit
              ])

          # Join lines and clean up excessive blank lines
          updated_content = '\n'.join(new_lines)
          updated_content = re.sub(r'\n{3,}', '\n\n', updated_content)

          print(updated_content)
          EOF
          )

          # Update the converted release
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            -d "$(jq -n --arg body "$UPDATED_BODY" '{body: $body}')"

          echo "Converted release body updated with version commit"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Remove any remaining Unreleased section after conversion
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          echo "Removing any remaining [Unreleased] section after beta-to-release conversion finalization"
          
          python3 << 'EOF'
          import re
          import os
          
          # Read current changelog
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          # Remove any [Unreleased] or [Unreleased Beta] section completely
          lines = content.split('\n')
          new_lines = []
          skip_unreleased = False
          
          for line in lines:
              if line.strip() in ["## [Unreleased]", "## [Unreleased Beta]"]:
                  skip_unreleased = True
                  continue
              elif skip_unreleased and line.startswith("## ") and not line.strip().startswith("## [Unreleased"):
                  # Found next section, stop skipping
                  skip_unreleased = False
                  new_lines.append(line)
              elif not skip_unreleased:
                  new_lines.append(line)
          
          # Clean up excessive blank lines
          final_lines = []
          for idx in range(len(new_lines)):
              current_line = new_lines[idx]
              # Remove excessive blank lines (more than one consecutive)
              is_excessive_blank = (
                  current_line == "" and
                  idx > 0 and
                  new_lines[idx - 1] == ""
              )
              
              if not is_excessive_blank:
                  final_lines.append(current_line)
          
          final_content = '\n'.join(final_lines)
          
          # Ensure proper ending
          if not final_content.endswith('\n'):
              final_content += '\n'
          
          # Write updated changelog
          with open('CHANGELOG.md', 'w') as f:
              f.write(final_content)
          
          print("Removed any remaining [Unreleased] sections from CHANGELOG.md")
          EOF

      - name: Commit final converted release changelog updates and update tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          if git diff --quiet CHANGELOG.md; then
            echo "No converted release changelog updates needed"
            TAG_COMMIT=$(git rev-list -n 1 $RELEASE_TAG)
            echo "Converted release tag already points to correct commit: $TAG_COMMIT"
          else
            # Commit the final changelog updates
            git add CHANGELOG.md
            git commit -m "Add changelog entry for converted release $RELEASE_TAG update"

            # Get the new commit hash
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit with converted release changelog updates: $NEW_COMMIT"

            # Update the release tag to point to the new commit
            git tag -f "$RELEASE_TAG" "$NEW_COMMIT"

            # Push both the commit and the updated tag
            git push
            git push --force origin "$RELEASE_TAG"

            echo "Final converted release changelog committed and release tag updated for $RELEASE_TAG"
            echo "Converted release tag now points to commit with changelog updates: $NEW_COMMIT"
          fi

      - name: Verify converted release associations
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "Verifying converted release associations for: $RELEASE_TAG"

          # Get the current tag commit
          TAG_COMMIT=$(git rev-list -n 1 $RELEASE_TAG)
          echo "Converted release tag commit: $TAG_COMMIT"

          # Verify this commit includes the changelog updates
          git show --name-only $TAG_COMMIT | grep -q "CHANGELOG.md" && \
            echo "✅ Converted release tag commit includes CHANGELOG.md updates" || \
            echo "ℹ️  Converted release tag commit is original release point (no additional changelog updates needed)"

          echo "Converted release successfully finalized and associated with commit: $TAG_COMMIT"
          echo "CHANGELOG.md, converted release body, and git tag are now synchronized"
