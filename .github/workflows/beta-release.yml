name: Beta Release

# Handles npm publishing and Discord for beta prereleases.
# Beta changelog management and tag finalize happen in flow-beta.yml.

on:
  release:
    types: [published]

jobs:
  build_lint_test:
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.event.release.target_commitish == 'beta' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: ./.github/workflows/build-lint-test.yml

  publish:
    needs: build_lint_test
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.event.release.target_commitish == 'beta' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      set_version_from_release_tag: true
      tag: beta
      build_cmd: npm run build
    secrets:
      npm_auth_token: ${{ secrets.NPM_TOKEN }}

  beta_release_to_discord:
    name: Discord Webhooks
    needs: [build_lint_test, publish]
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.event.release.target_commitish == 'beta' &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare trimmed release notes for Discord
        id: trim_notes
        run: |
          python3 .github/scripts/discord_release_notes.py --content-max 900 --hard-max 1024

      - name: Send Discord notification (trimmed details)
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: Success
          title: Kasa Python Beta Release
          description: ${{ steps.trim_notes.outputs.body }}
          url: https://github.com/ZeliardM/homebridge-kasa-python/releases/tag/${{ github.event.release.tag_name }}
          username: Homebridge
          avatar_url: https://raw.githubusercontent.com/homebridge/branding/latest/logos/homebridge-color-round-stylized.png
          nodetail: true
          nocontext: false
          notimestamp: false
          nofail: true