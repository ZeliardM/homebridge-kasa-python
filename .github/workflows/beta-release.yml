name: Beta Release

on:
  release:
    types: [published]

jobs:
  build_lint_test:
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build_lint_test
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    permissions:
      id-token: write
    uses: homebridge/.github/.github/workflows/npm-publish-esm.yml@latest
    with:
      tag: beta
      npm_version_command: pre
      pre_id: beta
      override_version: ${{ github.event.release.tag_name }}
    secrets:
      npm_auth_token: ${{ secrets.NPM_TOKEN }}

  github-releases-to-discord:
    name: Discord Webhooks
    needs: [build_lint_test, publish]
    if: >
      github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, 'beta') &&
      github.repository == 'ZeliardM/homebridge-kasa-python'
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "Kasa Python Beta Release"
      description: |
        Version `${{ github.event.release.tag_name }}`
      url: https://github.com/ZeliardM/homebridge-kasa-python/releases/tag/${{ github.event.release.tag_name }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
