name: Beta Release

on:
  push:
    branches: [beta-*.*.*, beta]
  workflow_dispatch:

jobs:
  build_lint_test:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build_lint_test
    if: ${{ github.repository == 'ZeliardM/homebridge-kasa-python' }}
    permissions:
      id-token: write
    uses: homebridge/.github/.github/workflows/npm-publish-esm.yml@latest
    with:
      tag: 'beta'
      dynamically_adjust_version: true
      npm_version_command: 'pre'
      pre_id: 'beta'
    secrets:
      npm_auth_token: ${{ secrets.NPM_TOKEN }}

  pre-release:
    needs: publish
    if: ${{ github.repository == 'ZeliardM/homebridge-kasa-python' }}
    uses: homebridge/.github/.github/workflows/pre-release.yml@latest
    with:
      npm_version: ${{ needs.publish.outputs.NPM_VERSION }}
      body: |
        **Beta Release**
        **Version**: v${{ needs.publish.outputs.NPM_VERSION }}

