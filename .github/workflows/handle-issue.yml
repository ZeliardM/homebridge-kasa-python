name: Classify, Label, & Validate Issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-validate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  detect-fork:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork.outputs.is_fork }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect fork context
        id: detect-fork
        uses: ./.github/actions/detect-fork

  classify:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false' && github.actor != 'github-actions[bot]'
    name: Classify Issue
    runs-on: ubuntu-latest
    outputs:
      applied_label: ${{ steps.classify.outputs.applied_label }}
      needs_info: ${{ steps.classify.outputs.needs_info }}
      messages: ${{ steps.classify.outputs.messages }}
      classification_json: ${{ steps.classify.outputs.classification_json }}
    steps:
      - name: Checkout scripts + actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure jq
        uses: ./.github/actions/ensure-jq

      - name: Classify
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: classify
        run: |
          set -euo pipefail
          RESULT="$(python3 .github/scripts/issue_manager.py)"
          echo "Raw classification: $RESULT"
          RESULT_B64="$(printf '%s' "$RESULT" | base64 -w 0)"
          echo "classification_json=$RESULT_B64" >> "$GITHUB_OUTPUT"
          APPLIED="$(echo "$RESULT" | jq -r '.applied_label // empty')"
          NEEDS="$(echo "$RESULT" | jq -r '.needs_info // false')"
          MSGS="$(echo "$RESULT" | jq -c '.messages // []')"
          echo "applied_label=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "needs_info=$NEEDS" >> "$GITHUB_OUTPUT"
          echo "messages=$MSGS" >> "$GITHUB_OUTPUT"

  label_and_comment:
    needs: [detect-fork, classify]
    if: needs.detect-fork.outputs.is_fork == 'false' && github.actor != 'github-actions[bot]'
    name: Apply Labels and Update Sticky Comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clear all labels (full reset)
        uses: ./.github/actions/clear-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.issue.number }}

      - name: Apply canonical label (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABEL="${{ needs.classify.outputs.applied_label }}"
          if [ -n "$LABEL" ]; then
            gh issue edit ${{ github.event.issue.number }} --add-label "$LABEL" || true
          fi

      - name: Apply or remove needs-info label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ needs.classify.outputs.needs_info }}" = "true" ]; then
            gh issue edit ${{ github.event.issue.number }} --add-label needs-info || true
          fi

      - name: Build sticky classification comment body
        shell: bash
        run: |
          set -euo pipefail
          MARK="<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          LABEL="${{ needs.classify.outputs.applied_label }}"
          NEEDS="${{ needs.classify.outputs.needs_info }}"
          MSGS_JSON="${{ needs.classify.outputs.messages }}"
          if [ -n "$MSGS_JSON" ] && [ "$MSGS_JSON" != "null" ]; then
            MSGS="$(echo "$MSGS_JSON" | jq -r '.[]?')"
          else
            MSGS=""
          fi
          {
            echo "🧭 Issue classification results"
            echo
            echo "- Classification: ${LABEL:-<none>}"
            echo "- Needs info: ${NEEDS}"
            if [ -n "$MSGS" ]; then
              echo
              echo "Notes:"
              echo '```'
              printf '%s\n' "$MSGS"
              echo '```'
            fi
            echo
            echo "_All existing labels were cleared and canonical labels will be enforced._"
            echo
            echo "$MARK"
          } > body.txt

      - name: Upsert sticky classification comment
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.issue.number }}
          marker: "<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          mode: upsert
          body_file: body.txt

  validate:
    needs: [detect-fork, classify, label_and_comment]
    if: needs.detect-fork.outputs.is_fork == 'false' && github.actor != 'github-actions[bot]'
    name: Validate Issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts + actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and capture outputs
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: validate
        run: |
          set -euo pipefail
          RESULT="$(python3 .github/scripts/issue_manager.py)"
          echo "Raw validation: $RESULT"
          OK="$(echo "$RESULT" | jq -r '.ok // false')"
          MSGS="$(echo "$RESULT" | jq -c '.messages // []')"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "messages=$MSGS" >> "$GITHUB_OUTPUT"

      - name: Update sticky with validation failure
        if: steps.validate.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          MARK="<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          VJ='${{ steps.validate.outputs.messages }}'
          if [ -n "$VJ" ] && [ "$VJ" != "null" ]; then
            VALMSGS="$(printf '%s' "$VJ" | jq -r '.[]?')"
          else
            VALMSGS=""
          fi
          {
            echo "❌ Issue validation failed."
            echo
            if [ -n "$VALMSGS" ]; then
              echo "Details:"
              echo '```'
              printf '%s\n' "$VALMSGS"
              echo '```'
              echo
            fi
            echo "Please update the issue with the requested information."
            echo
            echo "$MARK"
          } > new.txt

      - name: Upsert validation failure sticky
        if: steps.validate.outputs.ok != 'true'
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.issue.number }}
          marker: "<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          mode: upsert
          body_file: new.txt

      - name: Final sticky success update (show classification and labels)
        if: steps.validate.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          NUM="${{ github.event.issue.number }}"
          MARK="<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          LABELS_RAW="$(gh api repos/$REPO/issues/$NUM/labels --paginate --jq '.[].name' || true)"
          LABELS_LINE="$(echo "$LABELS_RAW" | awk 'NF' | sort -fu | awk '{printf "%s%s", sep, $0; sep=", "} END {print ""}')"
          CLASS="${{ needs.classify.outputs.applied_label }}"
          {
            echo "✅ Issue classified, labeled, and validated successfully!"
            echo
            echo "- Classification: ${CLASS:-<none>}"
            echo "- Current labels: ${LABELS_LINE:-<none>}"
            echo
            echo "Thank you. This issue now has the required information and labels."
            echo
            echo "$MARK"
          } > success.txt

      - name: Upsert success sticky
        if: steps.validate.outputs.ok == 'true'
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.issue.number }}
          marker: "<!-- COPILOT-STICKY:ISSUE-CLASSIFIER -->"
          mode: upsert
          body_file: success.txt

      - name: Fail job when invalid
        if: steps.validate.outputs.ok != 'true'
        shell: bash
        run: exit 1

  fork-notice:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow is running in a fork and will skip all privileged steps. Validation and labeling will run after the Issue is opened against the main repository."