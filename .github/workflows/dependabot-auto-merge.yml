name: Dependabot Auto-Merge

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  contents: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-fork:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork.outputs.is_fork }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect fork context
        id: detect-fork
        uses: ./.github/actions/detect-fork

  auto-merge:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actions (needed for local action)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Safety check
        id: safety
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          block=false
          [ "$UPDATE_TYPE" = "version-update:semver-major" ] && block=true
          {
            echo "block=$block"
          } >> "$GITHUB_OUTPUT"

      - name: Build sticky comment
        id: build_sticky
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.safety.outputs.block }}" = "true" ]; then
            {
              echo "⚠️ Dependabot update requires manual review."
              echo
              echo "Type: \`${{ steps.metadata.outputs.update-type }}\`"
              echo
              echo "Auto-merge skipped."
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
            } > body.txt
          else
            {
              echo "✅ Dependabot update is safe and will be auto-merged."
              echo
              echo "Type: \`${{ steps.metadata.outputs.update-type }}\`"
              echo
              echo "_GitHub will merge this PR automatically once required checks pass._"
              echo
              echo "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
            } > body.txt
          fi

      - name: Upsert sticky comment
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.pull_request.number }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
          mode: upsert
          body_file: body.txt

      - name: Auto-merge safe updates
        if: >
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == '' ||
            steps.metadata.outputs.update-type == 'null'
          ) &&
          steps.safety.outputs.block == 'false'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label auto-merged
          gh pr merge --auto --squash "$PR_URL"

  fork-notice:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow is running in a fork and will skip all privileged steps. Auto-merge and labeling will run after the PR is opened against the main repository."