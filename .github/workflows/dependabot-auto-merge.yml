name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Safety check
        id: safety
        shell: bash
        run: |
          set -euo pipefail
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          UPDATE='${{ steps.metadata.outputs.update-type }}'
          has_break=false
          echo "$LABELS" | grep -q '"breaking-change"' && has_break=true
          is_major=false
          [ "$UPDATE" = "version-update:semver-major" ] && is_major=true
          block=false
          $has_break && block=true
          $is_major && block=true
          {
            echo "block=$block"
            echo "update_type=$UPDATE"
            echo "has_breaking=$has_break"
          } >> "$GITHUB_OUTPUT"

      - name: Label PR
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label dependency
          case "${{ steps.metadata.outputs.update-type }}" in
            version-update:semver-major) gh pr edit "$PR_URL" --add-label dependency-major ;;
            version-update:semver-minor) gh pr edit "$PR_URL" --add-label dependency-minor ;;
            version-update:semver-patch) gh pr edit "$PR_URL" --add-label dependency-patch ;;
          esac
          if [ "${{ steps.safety.outputs.has_breaking }}" = "true" ]; then
            gh pr edit "$PR_URL" --add-label breaking-change
          fi

      - name: Auto-merge safe updates
        if: >
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          steps.safety.outputs.block == 'false'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label auto-merged
          gh pr merge --auto --squash "$PR_URL"

      - name: Post or update sticky review-required comment
        if: steps.safety.outputs.block == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARK="<!-- COPILOT-STICKY:DEPENDABOT-BLOCKED -->"

          {
            echo "⚠️ Dependabot update requires manual review."
            echo
            echo "Type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "Breaking label: ${{ steps.safety.outputs.has_breaking }}"
            echo
            echo "Auto-merge skipped."
            echo
            echo "$MARK"
          } > body.txt

          CID="$(gh api repos/$REPO/issues/$PR_NUM/comments --paginate \
            --jq '.[] | select(.body | contains("'"$MARK"'")) | .id' | head -n1 || true)"
          if [ -n "$CID" ]; then
            BODY="$(cat body.txt)"
            gh api repos/$REPO/issues/comments/$CID -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUM" --body-file body.txt
          fi

      - name: Remove sticky comment when no longer blocked
        if: steps.safety.outputs.block != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARK="<!-- COPILOT-STICKY:DEPENDABOT-BLOCKED -->"
          CID="$(gh api repos/$REPO/issues/$PR_NUM/comments --paginate \
            --jq '.[] | select(.body | contains("'"$MARK"'")) | .id' | head -n1 || true)"
          if [ -n "$CID" ]; then
            gh api repos/$REPO/issues/comments/$CID -X DELETE || true
          fi