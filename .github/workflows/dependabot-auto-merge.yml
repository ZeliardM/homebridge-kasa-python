name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Safety check
        id: safety
        run: |
          set -euo pipefail
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          UPDATE='${{ steps.metadata.outputs.update-type }}'
          has_break=false
          echo "$LABELS" | grep -q '"breaking-change"' && has_break=true
          is_major=false
            [ "$UPDATE" = "version-update:semver-major" ] && is_major=true
          block=false
          $has_break && block=true
          $is_major && block=true
          echo "block=$block" >> "$GITHUB_OUTPUT"
          echo "update_type=$UPDATE" >> "$GITHUB_OUTPUT"
          echo "has_breaking=$has_break" >> "$GITHUB_OUTPUT"

      - name: Label PR
        run: |
          gh pr edit "$PR_URL" --add-label dependency
          case "${{ steps.metadata.outputs.update-type }}" in
            version-update:semver-major) gh pr edit "$PR_URL" --add-label dependency-major ;;
            version-update:semver-minor) gh pr edit "$PR_URL" --add-label dependency-minor ;;
            version-update:semver-patch) gh pr edit "$PR_URL" --add-label dependency-patch ;;
          esac
          if [ "${{ steps.safety.outputs.has_breaking }}" = "true" ]; then
            gh pr edit "$PR_URL" --add-label breaking-change
          fi
        env: { PR_URL: ${{ github.event.pull_request.html_url }}, GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      - name: Auto-merge safe updates
        if: >
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          steps.safety.outputs.block == 'false'
        run: |
          gh pr edit "$PR_URL" --add-label auto-merged
          gh pr merge --auto --squash "$PR_URL"
        env: { PR_URL: ${{ github.event.pull_request.html_url }}, GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      - name: Comment for blocked updates
        if: steps.safety.outputs.block == 'true'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ Dependabot update requires manual review.\n\nType: \`${{ steps.metadata.outputs.update-type }}\`\nBreaking label: ${{ steps.safety.outputs.has_breaking }}\nAuto-merge skipped."
        env: { PR_URL: ${{ github.event.pull_request.html_url }}, GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
