name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  detect-fork:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.detect-fork.outputs.is_fork }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect fork context
        id: detect-fork
        uses: ./.github/actions/detect-fork

  auto-merge:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'false' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actions (needed for local action)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Safety check
        id: safety
        shell: bash
        run: |
          set -euo pipefail
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          UPDATE='${{ steps.metadata.outputs.update-type }}'
          has_break=false
          echo "$LABELS" | grep -q '"breaking-change"' && has_break=true
          is_major=false
          [ "$UPDATE" = "version-update:semver-major" ] && is_major=true
          block=false
          $has_break && block=true
          $is_major && block=true
          {
            echo "block=$block"
            echo "update_type=$UPDATE"
            echo "has_breaking=$has_break"
          } >> "$GITHUB_OUTPUT"

      - name: Label PR
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label dependency
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          if [ -z "$UPDATE_TYPE" ] || [ "$UPDATE_TYPE" = "null" ]; then
            gh pr edit "$PR_URL" --add-label dependency-lockfile
          else
            case "$UPDATE_TYPE" in
              version-update:semver-major)
                gh pr edit "$PR_URL" --add-label dependency-major
                ;;
              version-update:semver-minor)
                gh pr edit "$PR_URL" --add-label dependency-minor
                ;;
              version-update:semver-patch)
                gh pr edit "$PR_URL" --add-label dependency-patch
                ;;
            esac
          fi
          if [ "${{ steps.safety.outputs.has_breaking }}" = "true" ]; then
            gh pr edit "$PR_URL" --add-label breaking-change
          fi

      - name: Build blocked sticky comment body
        if: steps.safety.outputs.block == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "⚠️ Dependabot update requires manual review."
            echo
            echo "Type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "Breaking label: ${{ steps.safety.outputs.has_breaking }}"
            echo
            echo "Auto-merge skipped."
            echo
            echo "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
          } > body.txt

      - name: Upsert blocked sticky
        if: steps.safety.outputs.block == 'true'
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.pull_request.number }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
          mode: upsert
          body_file: body.txt

      - name: Auto-merge safe updates
        if: >
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == '' ||
            steps.metadata.outputs.update-type == 'null'
          ) &&
          steps.safety.outputs.block == 'false'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label auto-merged
          gh pr merge --auto --squash "$PR_URL"

      - name: Build success sticky comment body
        if: >
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == '' ||
            steps.metadata.outputs.update-type == 'null'
          ) &&
          steps.safety.outputs.block == 'false'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "✅ Dependabot update is safe and will be auto-merged."
            echo
            echo "Type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "Breaking label: ${{ steps.safety.outputs.has_breaking }}"
            echo
            echo "_GitHub will merge this PR automatically once required checks pass._"
            echo
            echo "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
          } > ok.txt

      - name: Upsert success sticky
        if: >
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == '' ||
            steps.metadata.outputs.update-type == 'null'
          ) &&
          steps.safety.outputs.block == 'false'
        uses: ./.github/actions/sticky-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.pull_request.number }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT-STATUS -->"
          mode: upsert
          body_file: ok.txt

      - name: Remove legacy blocked sticky marker
        uses: ./.github/actions/sticky-comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          number: ${{ github.event.pull_request.number }}
          marker: "<!-- COPILOT-STICKY:DEPENDABOT-BLOCKED -->"
          mode: delete

  fork-notice:
    needs: detect-fork
    if: needs.detect-fork.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow is running in a fork and will skip all privileged steps. Auto-merge and labeling will run after the PR is opened against the main repository."