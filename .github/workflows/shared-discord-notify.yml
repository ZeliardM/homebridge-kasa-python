---
name: Discord Notification

on:
  workflow_call:
    inputs:
      title:
        description: Title for the Discord Notification
        required: true
        type: string
    secrets:
      discord_webhook:
        description: Discord Webhook URL
        required: true

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Post Discord Notification
        id: post
        shell: bash
        env:
          DISCORD_TITLE: ${{ inputs.title }}
          WEBHOOK_URL: ${{ secrets.discord_webhook }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py
