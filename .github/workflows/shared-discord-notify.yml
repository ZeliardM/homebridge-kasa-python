name: Discord Notification

on:
  workflow_call:
    inputs:
      title:
        description: Title for the Discord Notification
        required: true
        type: string
    secrets:
      discord_webhook:
        description: Discord Webhook URL
        required: true

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Discord Payload
        id: webhook
        uses: sarisia/actions-status-discord@v1
        with:
          status: Success
          title: ${{ inputs.title }}
          description: Version `${{ github.event.release.tag_name }}`
          url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
          username: Homebridge
          avatar_url: https://raw.githubusercontent.com/homebridge/branding/latest/logos/homebridge-color-round-stylized.png
          color: 4726621
          nodetail: false
          nocontext: false
          notimestamp: false
          nofail: false
          ack_no_webhook: true

      - name: Build Trimmed Event Field Value
        id: release_notes
        env:
          CMD: trim
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py

      - name: Edit Payload with Trimmed Release Notes
        id: edit_payload
        env:
          CMD: edit-payload
          WEBHOOK_PAYLOAD: ${{ steps.webhook.outputs.payload }}
          EVENT_VALUE: ${{ steps.release_notes.outputs.body }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py

      - name: Post to Discord
        env:
          CMD: post
          WEBHOOK_URL: ${{ secrets.discord_webhook }}
          WEBHOOK_PAYLOAD: ${{ steps.edit_payload.outputs.payload }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py