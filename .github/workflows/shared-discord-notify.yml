---
name: Discord Notification

on:
  workflow_call:
    inputs:
      title:
        description: Title for the Discord Notification
        required: true
        type: string
    secrets:
      discord_webhook:
        description: Discord Webhook URL
        required: true

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python requests
        id: install_requests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Get Discord Payload
        id: webhook
        uses: sarisia/actions-status-discord@v1
        with:
          status: Success
          title: ${{ inputs.title }}
          description: Version `${{ github.event.release.tag_name }}`
          url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
          username: Homebridge
          avatar_url: https://raw.githubusercontent.com/homebridge/branding/latest/logos/homebridge-color-round-stylized.png
          color: 4726621
          nodetail: false
          nocontext: false
          notimestamp: false
          nofail: false
          ack_no_webhook: true

      - name: Build Trimmed Event Field Value
        id: release_notes
        shell: bash
        env:
          MODE: trim
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py

      - name: Edit Payload with Trimmed Release Notes
        id: edit_payload
        shell: bash
        env:
          MODE: edit-payload
          EVENT_VALUE: ${{ steps.release_notes.outputs.body }}
          WEBHOOK_PAYLOAD: ${{ steps.webhook.outputs.payload }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py

      - name: Post to Discord
        id: post
        shell: bash
        env:
          MODE: post
          EDITED_PAYLOAD: ${{ steps.edit_payload.outputs.edited_payload }}
          WEBHOOK_URL: ${{ secrets.discord_webhook }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discord_tools.py
