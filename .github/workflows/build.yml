name: Build, Lint, and Test

on:
  push:
    branches: [latest]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      node_versions:
        description: Optional list of Node.js versions to test against (json array string)
        required: false
        type: string
      python_versions:
        description: Optional list of Python versions to test against (json array string)
        required: false
        type: string

jobs:
  build_lint_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(inputs.node_versions || '["20","22","24"]') }}
        python-version: ${{ fromJson(inputs.python_versions || '["3.11","3.12","3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint Project
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Test Node Plugin
        run: |
          node <<'NODE'
          (async () => {
            try {
              await import('./dist/index.js');
              console.log('Node Import OK');
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          })();
          NODE

      - name: Test Python Dependencies
        run: |
          if [ -f requirements.txt ]; then
            set -e
            while IFS= read -r line || [ -n "$line" ]; do
              pkg=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -z "$pkg" ] && continue
              mod=$(echo "$pkg" | cut -d'=' -f1 | tr '-' '_')
              python -c "import ${mod}"
            done < requirements.txt
            echo "Python Imports OK"
          fi

      - name: Check outdated and audit
        run: |
          npm list --outdated || true
          npm audit || true