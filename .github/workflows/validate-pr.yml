name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr.py
          fetch-depth: 0

      - name: Run validation
        id: run
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(python3 .github/scripts/validate_pr.py)
          echo "$RESULT"
          OK=$(echo "$RESULT" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "error_message=$(echo "$RESULT" | jq -r '.message')" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Comment on failure with details
        if: failure()
        shell: bash
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERR="${{ steps.run.outputs.error_message }}"
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ PR validation failed:\n\`\`\`\n$ERR\n\`\`\`\nPlease correct and push updates."
