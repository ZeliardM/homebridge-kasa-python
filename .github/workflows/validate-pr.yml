name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr_body.js
          fetch-depth: 0

      - name: Collect PR metadata
        id: prmeta
        shell: bash
        run: |
          # Capture raw PR JSON safely (the expression is expanded by the Actions runner)
          cat > pr_raw.json <<PRJSON
${{ toJson(github.event.pull_request) }}
PRJSON

          # (Optional) Validate JSON (jq is usually preinstalled, but ensure)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
          jq . pr_raw.json >/dev/null

          {
            echo 'json<<EOF'
            cat pr_raw.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate
        run: |
          node .github/scripts/validate_pr_body.js
        env:
          PR_DATA: ${{ steps.prmeta.outputs.json }}
          ACTOR: ${{ github.actor }}

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment "$PR_URL" --body "❌ Validation failed. Ensure base branch is 'beta', at least one classification label is applied, and (if breaking-change) include the required explanation markers."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
