name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr.py
          fetch-depth: 0

      - name: Ensure jq is available
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run validation
        id: run
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(python3 .github/scripts/validate_pr.py)"
          echo "$RESULT"

          OK="$(echo "$RESULT" | jq -r '.ok // empty')"
          if [ "$OK" != "true" ]; then
            MSG="$(echo "$RESULT" | jq -r '.message // ""')"
            {
              echo "error_message<<EOF"
              printf "%s\n" "$MSG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Comment on failure with details
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "❌ PR validation failed:"
            echo
            echo "${{ steps.run.outputs.error_message }}"
            echo
            echo "Please correct and push updates."
          } > body.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.txt
