name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (script only)
        uses: actions/checkout@v4
        with:
            sparse-checkout: |
              .github/scripts/validate_pr_body.js
            fetch-depth: 0

      - name: Collect PR metadata
        id: prmeta
        shell: bash
        run: |
          # Safe heredoc capture of PR JSON (prevents quoting / EOF issues)
          cat > pr_raw.json <<PRJSON
${{ toJson(github.event.pull_request) }}
PRJSON

          # Optional validation / pretty-print (jq is small; install if missing)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
          jq . pr_raw.json >/dev/null

          # Emit multi-line output for downstream step
          {
            echo 'json<<EOF'
            cat pr_raw.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate
        run: |
          node .github/scripts/validate_pr_body.js
        env:
          PR_DATA: ${{ steps.prmeta.outputs.json }}
          ACTOR: ${{ github.actor }}

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment "$PR_URL" --body "❌ Validation failed. Please correct: base branch must be 'beta', include at least one classification label, and (if breaking-change) provide a full explanation section."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
