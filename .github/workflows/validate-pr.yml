name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr_body.js
          fetch-depth: 0

      - name: Collect PR metadata
        id: prmeta
        shell: bash
        run: |
          # Write PR JSON to file (the expression is expanded before execution)
          echo '${{ toJson(github.event.pull_request) }}' > pr_raw.json

          # (Optional) Validate JSON structure
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
            # Validate / pretty-print (discard output)
          jq . pr_raw.json >/dev/null

          # Expose as multi-line workflow output
          {
            echo 'json<<EOF'
            cat pr_raw.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate
        run: |
          node .github/scripts/validate_pr_body.js
        env:
          PR_DATA: ${{ steps.prmeta.outputs.json }}
          ACTOR: ${{ github.actor }}

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment "$PR_URL" --body "❌ Validation failed. Ensure base branch is 'beta', add a classification label, and if breaking-change provide the required explanation section with markers."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
