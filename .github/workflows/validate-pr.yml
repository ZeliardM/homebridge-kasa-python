name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr.py
          fetch-depth: 0

      - name: Run validation
        id: run
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(python3 .github/scripts/validate_pr.py)"
          echo "$RESULT"

          # Parse with jq
          OK="$(echo "$RESULT" | jq -r '.ok // empty')"
          if [ "$OK" != "true" ]; then
            MSG="$(echo "$RESULT" | jq -r '.message // ""')"
            # Pass message safely as base64 to avoid output parsing/newline issues
            MSG_B64="$(printf "%s" "$MSG" | base64 | tr -d '\n')"
            echo "error_message_b64=$MSG_B64" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Comment on failure with details
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ERR="$(printf "%s" "${{ steps.run.outputs.error_message_b64 }}" | base64 -d || true)"
          if [ -z "$ERR" ]; then ERR="Validation failed (no details provided)."; fi
          {
            echo "❌ PR validation failed:"
            echo
            echo '```'
            echo "$ERR"
            echo '```'
            echo
            echo 'Please correct and push updates.'
          } > body.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.txt
