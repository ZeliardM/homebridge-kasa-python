name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout validation script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/validate_pr_body.js
          fetch-depth: 0

      - name: Collect PR metadata
        id: prmeta
        shell: bash
        run: |
          # Directly serialize PR object to a single-line JSON output.
          # toJson returns a properly escaped JSON string (newlines in body become \n).
          echo "json=${{ toJson(github.event.pull_request) }}" >> "$GITHUB_OUTPUT"

      - name: Validate
        shell: bash
        run: |
            node .github/scripts/validate_pr_body.js
        env:
          PR_DATA: ${{ steps.prmeta.outputs.json }}
          ACTOR: ${{ github.actor }}

      - name: Comment on failure
        if: failure()
        shell: bash
        run: |
          gh pr comment "$PR_URL" --body "❌ Validation failed. Ensure base branch is 'beta', include at least one classification label, and (if breaking-change) provide a properly delimited explanation section."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
