name: Serialize PR Labels
description: Writes provided PR labels JSON to a file and exposes its path as an output
inputs:
  labels_json:
    description: JSON array of label names (e.g. from toJson(github.event.pull_request.labels.*.name))
    required: true
outputs:
  path:
    description: Path to the written labels JSON file
    value: ${{ steps.write.outputs.path }}
runs:
  using: composite
  steps:
    - id: write
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .github
        printf '%s\n' "${{ inputs.labels_json }}" > .github/pr-labels.json
        echo "path=.github/pr-labels.json" >> "$GITHUB_OUTPUT"