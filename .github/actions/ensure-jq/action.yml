name: Ensure jq
description: Ensure jq is Installed
runs:
  using: composite
  steps:
    - name: Ensure jq
      id: ensure-jq
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y jq
        fi
