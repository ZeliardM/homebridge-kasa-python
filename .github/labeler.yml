docs:
  - changed-files:
    - any-glob-to-any-file: '**/*.md'

branding:
  - changed-files:
    - any-glob-to-any-file: branding/**

enhancement:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'src/**/*'
          - any-glob-to-any-file: 'config.schema.json'
      - head-branch: '^feature/.*'
      - head-branch: '^feat/.*'

dependency:
  - changed-files:
      - any-glob-to-any-file: 'package.json'
      - any-glob-to-any-file: 'package-lock.json'
      - any-glob-to-any-file: 'requirements.txt'

workflow:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

fix:
  - any:
      - head-branch: '^fix/.*'
      - head-branch: '^hotfix/.*'
      - head-branch: '.*/fix-.*'

bug:
  - any:
      - head-branch: '^bug/.*'
      - head-branch: '.*/bug-.*'

breaking-change:
  - any:
      - head-branch: '(?i).*breaking.*'

beta:
  - base-branch: 'beta'

latest:
  - base-branch: 'latest'
